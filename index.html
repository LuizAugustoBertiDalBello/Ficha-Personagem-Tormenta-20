/* ===== Tokens ===== */
:root {
  --rubro: #3A0F16;
  --rubro-2: #4C1720;
  --papel: #FBFAF7;
  --papel-2: #F2EEE8;
  --tinta: #A11D2F;
  --tinta-2: #7F1524;
  --tinta-suave: rgba(161, 29, 47, .08);
  --grafite: #23262B;
  --cinza: #67625E;
  --cinza-2: #958E89;
  --linha: #E4DDD6;
  --linha-2: #CBC1B9;
  --mana: #2D4B8E;
  --alerta: #94600C;
  --ok: #2E6A4C;
  --sobre-rubro: #F6E8EA;
  --sombra: 0 24px 60px rgba(18, 3, 7, .45);
  --f-serif: 'Alegreya', Georgia, 'Times New Roman', serif;
  --f-sans: 'Alegreya Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
:root[data-tema="escuro"] {
  --rubro: #170609;
  --rubro-2: #250B10;
  --papel: #1E1A1B;
  --papel-2: #282223;
  --tinta: #E57683;
  --tinta-2: #F2A0AA;
  --tinta-suave: rgba(229, 118, 131, .12);
  --grafite: #EFE9E6;
  --cinza: #B6ADA9;
  --cinza-2: #887F7B;
  --linha: #3A3133;
  --linha-2: #4D4244;
  --mana: #97AEEC;
  --alerta: #E2AA4E;
  --ok: #82CBA5;
  --sombra: 0 24px 60px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --rubro: #170609;
    --rubro-2: #250B10;
    --papel: #1E1A1B;
    --papel-2: #282223;
    --tinta: #E57683;
    --tinta-2: #F2A0AA;
    --tinta-suave: rgba(229, 118, 131, .12);
    --grafite: #EFE9E6;
    --cinza: #B6ADA9;
    --cinza-2: #887F7B;
    --linha: #3A3133;
    --linha-2: #4D4244;
    --mana: #97AEEC;
    --alerta: #E2AA4E;
    --ok: #82CBA5;
    --sombra: 0 24px 60px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}

/* ===== Base ===== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--rubro);
  color: var(--grafite);
  font: 400 15px/1.45 var(--f-sans);
  font-variant-numeric: lining-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }
.topo :focus-visible { outline-color: var(--sobre-rubro); }
.num { font-variant-numeric: lining-nums tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mudo { color: var(--cinza); }
.peq { font-size: 13px; }
.nowrap { white-space: nowrap; }

/* ===== Barra do topo ===== */
.topo {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px max(16px, calc((100vw - 1240px) / 2));
  background: var(--rubro);
  color: var(--sobre-rubro);
  border-bottom: 1px solid rgba(255, 255, 255, .07);
}
.marca { font: 800 21px/1 var(--f-serif); margin-right: 10px; white-space: nowrap; }
.marca small { font: 400 13px var(--f-sans); opacity: .7; margin-left: 6px; }
.topo-sel {
  min-width: 0; max-width: 260px;
  background: var(--rubro-2); color: var(--sobre-rubro);
  border: 1px solid rgba(255, 255, 255, .22); border-radius: 4px; padding: 6px 8px;
}
.topo-sel option { color: #23262B; background: #fff; }
.topo-esp { flex: 1; }
.btn-topo {
  background: transparent; color: var(--sobre-rubro);
  border: 1px solid rgba(255, 255, 255, .26); border-radius: 4px;
  padding: 6px 11px; font: 500 14px/1.2 var(--f-sans); white-space: nowrap;
}
.btn-topo:hover { background: rgba(255, 255, 255, .09); }
.btn-topo.perigo { border-color: #F2A0AA; color: #FFD7DC; }
.menu-movel { display: none; }
.topo-acoes { display: contents; }
/* estado do salvamento na conta (página publicada) */
.nuvem-estado {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font: 500 13px/1.2 var(--f-sans); color: var(--sobre-rubro); opacity: .92; padding: 4px 2px;
}
.nuvem-estado::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .55; flex: none; }
.nuvem-estado.ok::before { background: #9FD8A9; opacity: 1; }
.nuvem-estado.local::before { background: #F5C46B; opacity: 1; }
.nuvem-estado.esperando::before { animation: pulso 1.2s ease-in-out infinite; }
@keyframes pulso { 50% { opacity: .15; } }
@media (prefers-reduced-motion: reduce) { .nuvem-estado.esperando::before { animation: none; } }
@media (max-width: 860px) { .nuvem-estado { font-size: 0; gap: 0; padding: 4px; } .nuvem-estado::before { width: 10px; height: 10px; } }
.carregando { padding: 64px 24px; text-align: center; font: 400 17px/1.5 var(--f-sans); color: var(--grafite-2, var(--grafite)); }
@media print { .nuvem-estado { display: none; } }
@media (max-width: 860px) {
  .topo-acoes { display: none; }
  .menu-movel { display: inline-flex; }
  .topo-sel { max-width: 46vw; }
}
.menu-pop {
  position: absolute; right: 16px; top: 52px; z-index: 35;
  background: var(--papel); color: var(--grafite);
  border: 1px solid var(--linha-2); border-radius: 6px; box-shadow: var(--sombra);
  padding: 6px; display: grid; min-width: 220px;
}
.menu-pop button { text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 4px; }
.menu-pop button:hover { background: var(--papel-2); }

/* ===== Folha ===== */
.folha {
  max-width: 1240px;
  margin: 16px auto 72px;
  background: var(--papel);
  border-radius: 6px;
  box-shadow: var(--sombra);
  padding: 28px clamp(16px, 3vw, 36px) 32px;
}
@media (max-width: 640px) {
  .folha { margin: 0 0 64px; border-radius: 0; padding: 20px 16px 28px; }
}

/* ===== Identidade ===== */
.ident {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px 26px; align-items: end;
  padding-bottom: 16px; border-bottom: 2px solid var(--tinta);
}
.retrato-caixa { display: grid; justify-items: center; gap: 2px; align-self: stretch; align-content: end; }
.retrato {
  position: relative; display: block; width: 124px; aspect-ratio: 3 / 4;
  padding: 4px; border: 1px solid var(--tinta); border-radius: 4px; background: var(--papel);
  overflow: hidden; cursor: grab; touch-action: none; color: inherit;
}
.retrato img {
  display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 2px;
  user-select: none; -webkit-user-drag: none; pointer-events: none;
}
.retrato.arrastando { cursor: grabbing; }
.retrato.vazio {
  display: grid; place-content: center; gap: 6px; text-align: center; cursor: pointer;
  border-style: dashed; color: var(--tinta);
}
.retrato.vazio:hover { background: var(--tinta-suave); }
.retrato-tit { font: 700 16px/1.1 var(--f-serif); }
.retrato-dica { font-size: 12px; line-height: 1.3; color: var(--cinza); padding: 0 6px; }
.retrato-caixa.alvo .retrato { outline: 2px dashed var(--tinta); outline-offset: 3px; background: var(--tinta-suave); }
.retrato-acoes { display: flex; gap: 2px; }
.retrato-acoes .btn-remover { font-size: 12.5px; padding: 1px 6px; }
.nome {
  width: 100%; border: 0; border-bottom: 1px dashed transparent; background: transparent;
  font: 800 clamp(28px, 4.2vw, 44px)/1.08 var(--f-serif); color: var(--grafite); padding: 2px 0;
}
.nome:hover { border-bottom-color: var(--linha-2); }
.nome:focus { outline: none; border-bottom-color: var(--tinta); }
.nome::placeholder { color: var(--cinza-2); }
.ident-sub { display: flex; gap: 10px 22px; flex-wrap: wrap; margin-top: 10px; }
.campo { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; color: var(--tinta); }
.campo input {
  border: 0; border-bottom: 1px solid var(--linha-2); background: transparent;
  font: 500 15px var(--f-sans); color: var(--grafite); padding: 2px; width: 180px; max-width: 52vw;
}
.campo input:focus { outline: none; border-bottom-color: var(--tinta); }
.nivel { display: flex; align-items: center; gap: 14px; }
.nivel-num { font: 800 54px/.9 var(--f-serif); color: var(--tinta); font-variant-numeric: lining-nums; }
.nivel-txt { font-size: 14px; line-height: 1.35; color: var(--cinza); }
.nivel-txt b { color: var(--grafite); font-weight: 600; }
.xp { width: 86px; border: 0; border-bottom: 1px solid var(--linha-2); background: transparent; padding: 1px 2px; font-size: 14px; }
@media (max-width: 640px) {
  .ident { grid-template-columns: auto minmax(0, 1fr); gap: 12px 14px; }
  .retrato { width: 92px; }
  .nivel { grid-column: 1 / -1; justify-content: flex-start; }
}

/* ===== Escolhas principais (raça, origem, classe, divindade) ===== */
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 24px; }
@media (max-width: 900px) { .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; } }
.slot {
  position: relative; display: block; width: 100%; min-height: 90px; text-align: left;
  background: transparent; border: 1px solid var(--tinta); border-radius: 4px;
  padding: 16px 14px 11px; color: inherit;
}
.slot:hover { background: var(--tinta-suave); }
.slot-rot {
  position: absolute; top: -10px; left: 10px; padding: 0 6px;
  background: var(--papel); font: 600 13px/20px var(--f-sans); color: var(--tinta);
}
.slot-val { display: block; font: 700 22px/1.15 var(--f-serif); color: var(--grafite); overflow-wrap: anywhere; }
.slot-sub { display: block; margin-top: 4px; font-size: 13.5px; color: var(--cinza); }
.slot.vazio { border-style: dashed; }
.slot.vazio .slot-val { color: var(--tinta); font-weight: 500; font-size: 18px; }
.slot.ativo { background: var(--papel-2); }
.slot.ativo::after { content: ""; position: absolute; left: -1px; right: -1px; bottom: -1px; height: 3px; background: var(--tinta); border-radius: 0 0 4px 4px; }
.slot-pend {
  position: absolute; top: -10px; right: 10px; padding: 0 7px; border-radius: 10px;
  background: var(--alerta); color: #fff; font: 700 12px/20px var(--f-sans);
}

/* ===== Painel de escolhas ===== */
.painel {
  margin-top: 16px; padding: 18px 20px 20px;
  background: var(--papel-2); border: 1px solid var(--linha); border-radius: 4px;
}
.painel-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.painel-tit { font: 700 20px/1.2 var(--f-serif); margin: 0; }
.painel-tit .mudo { font: 400 14px var(--f-sans); margin-left: 8px; }
.bloco { margin-top: 16px; }
.bloco-tit { font: 600 14.5px/1.3 var(--f-sans); color: var(--grafite); margin: 0 0 8px; }
.bloco-tit .mudo { font-weight: 400; }
.bloco p { margin: 4px 0 8px; max-width: 78ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--linha-2); background: var(--papel); color: var(--grafite);
  border-radius: 4px; padding: 5px 10px; font: 500 14px/1.25 var(--f-sans); text-align: left;
}
.chip:hover:not(:disabled) { border-color: var(--tinta); }
.chip[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: #fff; }
:root[data-tema="escuro"] .chip[aria-pressed="true"] { color: #1E1A1B; }
.chip:disabled { opacity: .42; cursor: not-allowed; }
.chip small { opacity: .75; font-size: 12px; }
.pend-lista { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.pend-lista.avisos { display: grid; gap: 4px; }
.pend-lista button {
  background: none; border: 0; padding: 2px 0; text-align: left; color: var(--alerta); font-weight: 500;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
}
.pend-ok { color: var(--ok); font-weight: 500; }
.desc { color: var(--cinza); font-size: 14px; max-width: 78ch; }
.op-desc { margin: 8px 0 0; padding: 8px 12px; border-left: 3px solid var(--tinta); background: var(--papel); font-size: 14px; max-width: 78ch; }
.sel {
  border: 1px solid var(--linha-2); background: var(--papel); border-radius: 4px; padding: 5px 8px; max-width: 100%;
}
.linha-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.opcoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.opcao {
  display: grid; gap: 2px; text-align: left; padding: 9px 12px;
  border: 1px solid var(--linha-2); border-radius: 4px; background: var(--papel); color: var(--grafite);
}
.opcao b { font: 700 15px/1.25 var(--f-serif); }
.opcao span { font-size: 13.5px; line-height: 1.4; color: var(--cinza); }
.opcao:hover:not(:disabled) { border-color: var(--tinta); }
.opcao[aria-pressed="true"] { border-color: var(--tinta); box-shadow: inset 4px 0 0 var(--tinta); background: var(--tinta-suave); }
.opcao:disabled { opacity: .45; cursor: not-allowed; }
.lista-habs { margin: 4px 0 0; padding-left: 18px; font-size: 14px; max-width: 80ch; }
.lista-habs li { margin: 4px 0; }

/* ===== Botões ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--tinta); color: var(--tinta); background: transparent;
  border-radius: 4px; padding: 6px 12px; font: 600 14px/1.25 var(--f-sans); white-space: nowrap;
}
.btn:hover { background: var(--tinta-suave); }
.btn-pri { background: var(--tinta); color: #fff; }
:root[data-tema="escuro"] .btn-pri { color: #1E1A1B; }
.btn-pri:hover { background: var(--tinta-2); }
.btn-q { border-color: transparent; padding-left: 6px; padding-right: 6px; }
.btn-mini { padding: 2px 8px; font-size: 13px; }
.btn-ico { width: 28px; height: 28px; padding: 0; font: 700 17px/1 var(--f-sans); }
.btn-ico.mini { width: 24px; height: 24px; font-size: 15px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-remover { border: 1px solid transparent; background: transparent; color: var(--cinza); padding: 2px 6px; border-radius: 4px; font: 500 13px var(--f-sans); }
.btn-remover:hover { color: var(--tinta); background: var(--tinta-suave); }

/* ===== Seções ===== */
.sec { margin-top: 30px; }
.sec-tit {
  display: flex; align-items: center; gap: 12px;
  font: 700 19px/1.2 var(--f-serif); color: var(--tinta); margin: 0 0 12px;
}
.sec-tit .linha { flex: 1; height: 1px; background: var(--linha-2); }
.sec-tit .acoes { display: flex; gap: 6px; font-family: var(--f-sans); }
.grade { display: grid; grid-template-columns: 286px minmax(0, 1fr) 300px; gap: 30px; margin-top: 4px; }
@media (max-width: 1120px) {
  .grade { grid-template-columns: 270px minmax(0, 1fr); }
  .col-per { grid-column: 1 / -1; }
  .col-per .pers { columns: 2; column-gap: 28px; }
}
@media (max-width: 760px) {
  .grade { grid-template-columns: 1fr; gap: 6px; }
  .col-per .pers { columns: 1; }
}

/* ===== Atributos ===== */
.metodo { display: flex; gap: 0; margin-bottom: 18px; border: 1px solid var(--linha-2); border-radius: 4px; overflow: hidden; width: fit-content; }
.metodo button { border: 0; background: var(--papel); padding: 5px 12px; font: 500 13.5px var(--f-sans); color: var(--cinza); }
.metodo button + button { border-left: 1px solid var(--linha-2); }
.metodo button[aria-pressed="true"] { background: var(--grafite); color: var(--papel); }
.pontos { font-size: 13.5px; color: var(--cinza); margin: -8px 0 14px; }
.pontos b { color: var(--grafite); }
.pontos.erro b { color: var(--tinta); }
.atrs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
@media (max-width: 760px) { .atrs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 420px) { .atrs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.atr { position: relative; border: 1px solid var(--tinta); border-radius: 4px; padding: 15px 6px 8px; text-align: center; }
.atr-rot {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  background: var(--papel); padding: 0 6px; font: 600 13px/20px var(--f-sans); color: var(--tinta); white-space: nowrap;
}
.atr-val { font: 800 40px/1 var(--f-serif); font-variant-numeric: lining-nums tabular-nums; color: var(--grafite); }
.atr-brk { font-size: 12px; line-height: 1.3; color: var(--cinza); min-height: 16px; margin-top: 4px; }
.atr-ctrl { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; }
.atr-ctrl .base { min-width: 28px; font-weight: 600; font-size: 14px; }
.atr-ctrl input { width: 52px; text-align: center; border: 1px solid var(--linha-2); border-radius: 4px; background: var(--papel); padding: 2px; }
.rolagens { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 16px; }
.rol { border: 1px dashed var(--linha-2); border-radius: 4px; padding: 3px 8px; font-size: 13px; }
.rol b { font: 700 15px var(--f-serif); }
.rol.usado { opacity: .45; }
.carac { margin-top: 22px; }
.carac dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.carac dt { color: var(--tinta); }
.carac dd { margin: 0; }
.marcas { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 10px; }
.marca-tag { border: 1px solid var(--linha-2); border-radius: 3px; padding: 1px 7px; font-size: 13px; color: var(--grafite); }

/* ===== Vitais ===== */
.vitais { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 12px; }
@media (max-width: 420px) { .vitais { grid-template-columns: repeat(2, minmax(0, 1fr)); } .vital.def { grid-column: 1 / -1; } }
.vital { position: relative; border: 1px solid var(--tinta); border-radius: 4px; padding: 16px 8px 10px; text-align: center; }
.vital .atr-rot { color: var(--tinta); }
.vital-num { font: 800 46px/1 var(--f-serif); font-variant-numeric: lining-nums tabular-nums; }
.vital-num .max { font-size: 22px; font-weight: 700; color: var(--cinza); }
.vital.pv .vital-num { color: var(--tinta); }
.vital.pm { border-color: var(--mana); }
.vital.pm .atr-rot, .vital.pm .vital-num { color: var(--mana); }
.vital .ctrl { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 8px; }
.vital .ctrl input { width: 46px; text-align: center; border: 1px solid var(--linha-2); border-radius: 4px; background: var(--papel); padding: 2px; }
.vital .brk { font-size: 12px; color: var(--cinza); margin-top: 6px; line-height: 1.3; }
.vital.pm .btn { border-color: var(--mana); color: var(--mana); }
.temp { font-size: 12px; color: var(--cinza); margin-top: 4px; }
.temp input { width: 40px; border: 0; border-bottom: 1px solid var(--linha-2); background: transparent; text-align: center; }
.res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.res-item {
  display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
  border-bottom: 1px solid var(--linha-2); padding: 4px 2px; background: none; border-top: 0; border-left: 0; border-right: 0; text-align: left;
}
.res-item span { color: var(--tinta); font-size: 14px; }
.res-item b { font: 700 22px var(--f-serif); font-variant-numeric: lining-nums tabular-nums; }
.res-item:hover b { color: var(--tinta); }
.dados { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
@media (max-width: 520px) { .dados { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.dado { border-bottom: 1px solid var(--linha-2); padding: 4px 2px; }
.dado span { display: block; color: var(--tinta); font-size: 13px; }
.dado b { font: 700 18px var(--f-serif); font-variant-numeric: lining-nums tabular-nums; }
.carga-barra { height: 6px; background: var(--linha); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.carga-barra i { display: block; height: 100%; background: var(--grafite); }
.carga-barra.sobre i { background: var(--alerta); }
.carga-barra.exc i { background: var(--tinta); }
.cond { margin-top: 16px; }
.cond summary { cursor: pointer; color: var(--tinta); font-size: 14px; }
.cond .chips { margin-top: 8px; }
.cond .chip { padding: 3px 8px; font-size: 13px; }
.cond-ativas { font-size: 13.5px; margin-top: 6px; }

/* ===== Tabelas ===== */
.tab { width: 100%; border-collapse: collapse; font-size: 14px; }
.tab th {
  font: 600 12.5px/1.2 var(--f-sans); color: var(--tinta); text-align: left;
  padding: 6px 8px; border-bottom: 1px solid var(--tinta); white-space: nowrap;
}
.tab td { padding: 7px 8px; border-bottom: 1px solid var(--linha); vertical-align: top; }
.tab td.n, .tab th.n { text-align: right; font-variant-numeric: lining-nums tabular-nums; }
.tab .forte { font: 700 15px var(--f-serif); }
.tab tr.clicavel { cursor: pointer; }
.tab tr.clicavel:hover td { background: var(--tinta-suave); }
.tab .obs { font-size: 12.5px; color: var(--cinza); margin-top: 2px; }
.tab-rolar { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tab input.qtd { width: 44px; text-align: center; border: 1px solid var(--linha-2); border-radius: 4px; background: var(--papel); padding: 1px; }
.vazio-msg { color: var(--cinza); font-size: 14px; padding: 10px 0; }
.vazio-msg button { margin-left: 6px; }

/* ===== Perícias ===== */
.pers { list-style: none; margin: 0; padding: 0; font-size: 14.5px; }
.per { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--linha); break-inside: avoid; }
.per-marca {
  width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--tinta); background: transparent; padding: 0;
}
.per-marca[aria-pressed="true"] { background: var(--tinta); }
.per-marca:disabled { cursor: default; }
.per-marca.fixa { opacity: .9; }
.per-nome { background: none; border: 0; padding: 1px 0; text-align: left; color: inherit; min-width: 0; }
.per-nome:hover .nm { color: var(--tinta); text-decoration: underline; text-underline-offset: 3px; }
.per-nome .at { font-size: 12px; color: var(--cinza); margin-left: 4px; }
.per-nome .tag { font-size: 11.5px; color: var(--alerta); margin-left: 4px; }
.per-tot { font: 700 16px var(--f-serif); font-variant-numeric: lining-nums tabular-nums; min-width: 34px; text-align: right; }
.per.inativa .per-tot, .per.inativa .nm { color: var(--cinza-2); }
.per-leg { font-size: 12.5px; color: var(--cinza); margin-top: 8px; }

/* ===== Habilidades e poderes ===== */
.habs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 34px; }
@media (max-width: 860px) { .habs { grid-template-columns: 1fr; } }
.hab-grupo { break-inside: avoid; margin-bottom: 14px; }
.hab-grupo h3 { font: 600 14px/1.3 var(--f-sans); color: var(--tinta); margin: 0 0 4px; padding-bottom: 4px; border-bottom: 1px solid var(--linha-2); }
.hab { padding: 7px 0; border-bottom: 1px solid var(--linha); }
.hab-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.hab-nome { font: 700 15.5px/1.3 var(--f-serif); }
.hab-nv { font-size: 12px; color: var(--cinza); margin-left: 6px; font-family: var(--f-sans); font-weight: 400; }
.hab-txt { font-size: 14px; line-height: 1.45; margin-top: 2px; }
.hab-extra { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.hab-extra input { border: 1px solid var(--linha-2); border-radius: 4px; background: var(--papel); padding: 3px 6px; min-width: 160px; }
.pre { font-size: 12.5px; margin-top: 3px; color: var(--cinza); }
.pre .ok { color: var(--ok); }
.pre .no { color: var(--tinta); }
.pre .q { color: var(--alerta); }

/* ===== Magias ===== */
.conj { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; margin-bottom: 10px; }
.conj b { font-family: var(--f-serif); font-size: 16px; }
.mag-circ { font: 600 14px var(--f-sans); color: var(--tinta); margin: 14px 0 4px; }
.mag { border-bottom: 1px solid var(--linha); }
.mag-cab { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline; padding: 7px 0; }
.mag-nome { background: none; border: 0; padding: 0; text-align: left; font: 700 15.5px var(--f-serif); }
.mag-nome:hover { color: var(--tinta); }
.mag-nome .mudo { font: 400 13px var(--f-sans); margin-left: 6px; }
.mag-pm { font: 700 14px var(--f-sans); color: var(--mana); white-space: nowrap; }
.mag-corpo { padding: 0 0 10px; font-size: 14px; }
.mag-stats { display: flex; flex-wrap: wrap; gap: 2px 16px; color: var(--cinza); font-size: 13px; margin-bottom: 4px; }
.mag-stats b { color: var(--grafite); font-weight: 600; }

/* ===== Inventário ===== */
.inv-topo { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin-bottom: 10px; }
.dinheiro { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--tinta); }
.dinheiro input { width: 110px; border: 0; border-bottom: 1px solid var(--linha-2); background: transparent; font: 700 18px var(--f-serif); color: var(--grafite); padding: 1px 2px; }
.carga-resumo { font-size: 14px; color: var(--cinza); min-width: 200px; }
.carga-resumo b { color: var(--grafite); }
.equip { width: 18px; height: 18px; accent-color: var(--tinta); }
.vest-aviso { color: var(--alerta); font-size: 13px; }

/* ===== Notas ===== */
.notas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; }
@media (max-width: 760px) { .notas { grid-template-columns: 1fr; } }
.nota label { display: block; color: var(--tinta); font-size: 13.5px; margin-bottom: 4px; }
.nota textarea {
  width: 100%; min-height: 110px; resize: vertical;
  border: 1px solid var(--linha); border-radius: 4px; background: transparent; padding: 8px 10px; line-height: 1.5;
  background-image: linear-gradient(transparent calc(1.5em + 7px), var(--linha) calc(1.5em + 7px), var(--linha) calc(1.5em + 8px), transparent calc(1.5em + 8px));
  background-size: 100% 1.5em;
}
.nota textarea:focus { outline: none; border-color: var(--tinta); }
.nota-imp { display: none; }
.rodape { margin-top: 34px; padding-top: 12px; border-top: 1px solid var(--linha); font-size: 12.5px; color: var(--cinza); display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }

/* ===== Gaveta (seletores) ===== */
.gaveta-fundo { position: fixed; inset: 0; z-index: 40; background: rgba(18, 3, 7, .5); }
.gaveta {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
  width: min(620px, 100vw); display: flex; flex-direction: column;
  background: var(--papel); box-shadow: -18px 0 50px rgba(0, 0, 0, .3);
  animation: gaveta-entra .18s ease-out;
}
@keyframes gaveta-entra { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
.gav-cab { padding: 16px 20px 12px; border-bottom: 1px solid var(--linha); }
.gav-tit { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.gav-tit h2 { font: 700 22px/1.2 var(--f-serif); margin: 0; }
.gav-tit p { margin: 2px 0 0; font-size: 13.5px; color: var(--cinza); }
.gav-busca { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.gav-busca input[type=search] {
  flex: 1 1 220px; border: 1px solid var(--linha-2); border-radius: 4px; background: var(--papel); padding: 8px 10px;
}
.gav-filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.gav-filtros .chip { padding: 3px 9px; font-size: 13px; }
.gav-filtros .chip[aria-pressed="true"], :root[data-tema="escuro"] .gav-filtros .chip[aria-pressed="true"] { background: var(--tinta-suave); color: var(--tinta); border-color: var(--tinta); }
.gav-corpo { flex: 1; overflow: auto; padding: 4px 20px 28px; overscroll-behavior: contain; }
.gav-cont { font-size: 12.5px; color: var(--cinza); margin: 10px 0 2px; }
.it { border-bottom: 1px solid var(--linha); }
.it-btn {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline;
  padding: 11px 0; background: none; border: 0; text-align: left; color: inherit;
}
.it-btn:hover .it-tit { color: var(--tinta); }
.it-tit { font: 700 17px/1.25 var(--f-serif); }
.it-sub { display: block; font-size: 13px; color: var(--cinza); margin-top: 2px; font-family: var(--f-sans); font-weight: 400; }
.it-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.fonte-tag { font-size: 11.5px; border: 1px solid var(--linha-2); border-radius: 3px; padding: 0 5px; color: var(--cinza); white-space: nowrap; }
.it.escolhido .it-tit::after { content: "  escolhido"; font: 500 12px var(--f-sans); color: var(--ok); }
.it-det { padding: 0 0 16px; font-size: 14px; }
.it-det p { margin: 6px 0; max-width: 72ch; }
.it-det h4 { font: 600 13.5px var(--f-sans); color: var(--tinta); margin: 12px 0 4px; }
.it-det ul { margin: 4px 0; padding-left: 18px; }
.it-det li { margin: 3px 0; }
.it-acao { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.niv-tab { width: 100%; border-collapse: collapse; font-size: 13px; }
.niv-tab td { padding: 3px 6px; border-bottom: 1px solid var(--linha); vertical-align: top; }
.niv-tab td:first-child { white-space: nowrap; color: var(--tinta); width: 1%; }
.form-grade { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 16px; margin-top: 10px; }
@media (max-width: 520px) { .form-grade { grid-template-columns: 1fr; } }
.form-grade label { display: grid; gap: 4px; font-size: 13.5px; color: var(--tinta); }
.form-grade input, .form-grade select, .form-grade textarea {
  border: 1px solid var(--linha-2); border-radius: 4px; background: var(--papel); padding: 6px 8px; color: var(--grafite); font-size: 14.5px;
}
.form-grade .largo { grid-column: 1 / -1; }

/* ===== Rolagens e avisos ===== */
.rolagem { position: fixed; right: 16px; bottom: 16px; z-index: 45; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.rolagem .r {
  pointer-events: auto; min-width: 220px; max-width: min(340px, calc(100vw - 32px));
  background: var(--papel); color: var(--grafite); border: 1px solid var(--linha-2); border-left: 4px solid var(--tinta);
  border-radius: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); padding: 9px 12px 10px;
  animation: rol-entra .16s ease-out;
}
@keyframes rol-entra { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.r-tit { font-size: 13px; color: var(--cinza); display: flex; justify-content: space-between; gap: 10px; }
.r-tit button { background: none; border: 0; color: var(--cinza); padding: 0 2px; }
.r-res { font: 800 30px/1.1 var(--f-serif); font-variant-numeric: lining-nums; }
.r-res small { font: 400 13px var(--f-sans); color: var(--cinza); margin-left: 6px; }
.r.crit { border-left-color: var(--ok); }
.r.falha { border-left-color: var(--cinza-2); }
.aviso-salvo {
  position: fixed; left: 16px; bottom: 16px; z-index: 44; font-size: 13px;
  background: var(--papel); color: var(--cinza); border: 1px solid var(--linha); border-radius: 4px;
  padding: 5px 10px; opacity: 0; transition: opacity .3s; pointer-events: none;
}
.aviso-salvo.vis { opacity: 1; }
.aviso-salvo.erro { color: var(--tinta); border-color: var(--tinta); opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ===== Impressão ===== */
@media print {
  @page { size: A4; margin: 11mm; }
  :root, :root[data-tema="escuro"] {
    --papel: #fff; --papel-2: #fff; --grafite: #111; --cinza: #555; --cinza-2: #888;
    --linha: #ccc; --linha-2: #999; --tinta: #9E1A2C; --mana: #2D4B8E; --alerta: #7a4f0b;
    color-scheme: light;
  }
  body { background: #fff; font-size: 12px; }
  .topo, .painel, #gaveta-raiz, .rolagem, .aviso-salvo, .nao-imprime, .btn, .btn-ico, .metodo, .pontos, .rolagens, .atr-ctrl, .vital .ctrl, .cond summary, .chips .chip:not([aria-pressed="true"]), .per-leg { display: none !important; }
  .folha { box-shadow: none; margin: 0; max-width: none; padding: 0; border-radius: 0; }
  .ident { grid-template-columns: auto minmax(0, 1fr) auto; }
  .retrato { width: 96px; }
  .retrato-dica { display: none; }
  .slots { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .slot { min-height: 0; padding: 12px 10px 6px; }
  .slot-val { font-size: 17px; }
  .slot-pend { display: none; }
  .nome { font-size: 30px; }
  .grade { grid-template-columns: 196px minmax(0, 1fr); gap: 18px; }
  .col-per { grid-column: 1 / -1; }
  .col-per .pers { columns: 3; column-gap: 22px; }
  .atrs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; }
  .vitais { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .temp, .campo input:placeholder-shown, .slot.vazio .slot-sub { display: none; }
  .vital .brk { font-size: 10.5px; }
  .notas { grid-template-columns: 1fr 1fr; }
  .nota textarea { display: none; }
  .nota-imp { display: block !important; white-space: pre-wrap; font-size: 11.5px; line-height: 1.45; border-top: 1px solid #ccc; padding-top: 4px; min-height: 40px; }
  .nota.vazia { display: none; }
  .tab input.qtd { border: 0; width: 28px; padding: 0; }
  .sec { margin-top: 16px; }
  .atr-val { font-size: 30px; }
  .vital-num { font-size: 34px; }
  .per { padding: 1px 0; font-size: 12px; }
  .habs { grid-template-columns: 1fr 1fr; gap: 2px 20px; }
  .hab { break-inside: avoid; padding: 4px 0; }
  .hab-txt, .tab, .mag-corpo { font-size: 11.5px; }
  .mag-corpo { display: block !important; }
  .sec-magias, .sec-inv, .sec-notas { break-before: auto; }
  a { color: inherit; }
}

</style>
</head>

// Armas, armaduras, escudos e munições (T20, AA, DH).
// prop: cc = corpo a corpo, ar = arremesso, dp = disparo | emp: L = leve, 1 = uma mão, 2 = duas mãos
// hab: agil, adaptavel, alongada, desbalanceada, dupla, hibrida, ocultavel, surpreendente, versatil,
//      arremessavel (arma corpo a corpo que pode ser arremessada), somaFor (disparo que soma Força), des (ataque com Destreza), naoLetal
window.numT20 = v => { v = String(v == null ? '' : v).trim().replace(/^T\$\s*/, ''); if (!v || /^[-—–]$/.test(v)) return 0; if (/^\d+\/\d+$/.test(v)) { const [a, b] = v.split('/'); return a / b; } return parseFloat(v.replace(/\.(?=\d{3}\b)/g, '').replace(',', '.')) || 0; };
window.AR = (cat, txt) => txt.trim().split('\n').forEach(l => {
  const [n, prop, emp, preco, dano, crit, alc, tipo, esp, f, hab, nota] = l.split('|').map(s => (s || '').trim());
  T20.armas.push({ n, cat, prop, emp, preco: numT20(preco), dano, crit, alc: alc || '—', tipo, esp: numT20(esp), f, hab: hab ? hab.split(',').map(s => s.trim()) : [], nota: nota || '' });
});

function rolarExpr(expr) {
  // aceita "2d6+3", "1d8", "4d6", "5"
  const partes = String(expr).replace(/\s+/g, '').replace(/−/g, '-').match(/[+-]?[^+-]+/g) || [];
  let total = 0; const det = [];
  for (const p of partes) {
    const m = p.match(/^([+-]?)(\d*)d(\d+)$/i);
    if (m) {
      const s = m[1] === '-' ? -1 : 1, q = +(m[2] || 1), l = +m[3];
      const rs = Array.from({ length: Math.min(q, 100) }, () => d(l));
      total += s * soma(rs); det.push((s < 0 ? '−' : '') + '[' + rs.join(', ') + ']');
    } else if (/^[+-]?\d+$/.test(p)) { total += +p; det.push(sinal(+p)); }
  }
  return { total, det: det.join(' ') };
}

function normalizarPersonagem(src) {

// ----- poderes -----
// lista de poderes de uma classe: a da classe básica (livro básico + DH) e, numa variante, os poderes exclusivos dela
function fontesPoder(c) {
  const b = c.base ? CLASSE(c.base) : c;
  const out = [];
  if (b) {
    (b.pod || []).forEach(r => out.push({ r, f: b.f }));
    (b.podDH || []).forEach(r => out.push({ r, f: 'DH' }));
  }
  if (c.base) (c.podV || []).forEach(r => out.push({ r, f: c.f }));
  return out;
}
function defPoder(p) {
  if (p.tipo === 'Classe') {
    const c = CLASSE(p.classe); if (!c) return null;
    const x = fontesPoder(c).find(x => x.r[0] === p.n);
    if (!x) return null;
    const row = x.r;
    return { n: row[0], pre: row[1] || '', r: row[2], ef: row[3], tipo: 'Classe', classe: c.id, f: x.f, op: row[0] === 'Aumento de Atributo' ? ATR : undefined };
  }
  if (p.tipo === 'Origem') {
    const o = ORIGEM(p.origem);
    if (o && o.unico && mesmo(o.unico[0], p.n)) return { n: o.unico[0], pre: '', r: o.unico[1], ef: o.unico[2], tipo: 'Origem', f: o.f };

  return T20.poderes.find(x => x.n === p.n && x.tipo === p.tipo) || T20.poderes.find(x => mesmo(x.n, p.n)) || null;

function poderesDeClasse(id, paraClasse) {

    .map(({ r, f }) => ({ n: r[0], pre: r[1] || '', r: r[2], ef: r[3], tipo: 'Classe', classe: id, f }));
}
function origemBeneficios(o) {

    const g = T20.poderes.find(x => x.tipo !== 'Concedido' && mesmo(x.n, n));
    out.push({ tipo: 'pod', n: g ? g.n : n, ptipo: g ? g.tipo : 'Origem', def: g || null });
  });

}
function concedidosDe(deus) {
  if (!deus) return [];
  return deus.poderes.map(n => T20.poderes.find(p => p.tipo === 'Concedido' && mesmo(p.n, n))).filter(Boolean);

// escolhas de classe: uma opção ou várias (e.multi = número ou função do nível)
function escolhidasDe(c, e) {

}
const qtdEscolha = (e, niveis) => typeof e.multi === 'function' ? e.multi(niveis) : (e.multi || 1);
// dado médio, para comparar danos desarmados ("1d8", "2d6")
const mediaDado = d => { const m = /^(\d+)d(\d+)$/.exec(String(d || '')); return m ? +m[1] * (+m[2] + 1) / 2 : 0; };

// ----- pré-requisitos (avaliação aproximada) -----
const PROF_MAP = { 'armas marciais': 'marciais', 'armas de fogo': 'fogo', 'armaduras pesadas': 'pesadas', 'escudos': 'escudos', 'armas exoticas': 'exoticas' };
function checarPre(pre, D) {
  if (!pre) return { ok: true, itens: [] };
  const itens = pre.split(/;|,(?![^(]*\))/).map(s => s.trim()).filter(Boolean).map(t => ({ t, ok: avaliarTok(t, D) }));
  const ok = itens.some(i => i.ok === false) ? false : itens.every(i => i.ok === true) ? true : null;
  return { ok, itens };
}
function avaliarTok(t, D) {
  if (!/^treinad/i.test(t) && /\s+ou\s+/i.test(t)) {
    const rs = t.split(/\s+ou\s+/i).map(a => avaliarTok1(a.trim(), D));
    return rs.includes(true) ? true : rs.includes(null) ? null : false;
  }
  return avaliarTok1(t, D);
}
function avaliarTok1(t, D) {
  let m;
  if ((m = t.match(/^(For|Des|Con|Int|Sab|Car)\s*(-?\d+)$/i))) return D.at[m[1].toLowerCase()] >= +m[2];
  if ((m = t.match(/^(\d+)º nível de personagem$/i))) return D.nivel >= +m[1];
  if ((m = t.match(/^(\d+)º nível de (.+)$/i))) {
    const c = T20.classes.find(c => mesmo(c.n, m[2]));
    if (!c) return null;
    if (D.nivelDe(c.id) >= +m[1]) return true;
    // classe cujos poderes você escolhe "como se tivesse o mesmo nível" (ex.: vassalo com poderes de guerreiro e nobre)
    return D.cls.some(x => (x.def.podOutras || []).includes(c.id) && x.niveis >= +m[1]);
  }
  if ((m = t.match(/^treinad[oa]s? em (.+)$/i))) {
    const ou = /\s+ou\s+/i.test(m[1]);
    const rs = m[1].split(/\s+e\s+|\s+ou\s+/i).map(s => s.trim()).map(n => {
      if (n === 'Ofício') return D.oficios.length > 0;
      if (ehOficio(n)) return D.trein.has(n);
      return PERN[n] ? D.trein.has(n) : null;
    });
    if (ou) return rs.includes(true) ? true : rs.includes(null) ? null : false;
    return rs.includes(false) ? false : rs.includes(null) ? null : true;
  }
  if ((m = t.match(/^Raça: (.+)$/i))) {
    if (!D.raca) return false;
    const lista = m[1].split(/,\s*/);
    if (lista.some(r => mesmo(r, 'Várias'))) return null;
    return lista.some(r => normal(D.raca.n).startsWith(normal(r)));
  }
  if ((m = t.match(/^proficiência com (.+)$/i))) {
    const k = PROF_MAP[normal(m[1])];
    return k ? D.prof.has(k) : null;
  }
  if (/^devot[oa]/i.test(t)) {
    if (!D.deus) return false;
    const citados = T20.deuses.filter(x => t.includes(x.n));
    if (citados.length) return citados.some(x => x.n === D.deus.n);
    return null;
  }
  if (D.temNome(t)) return true;
  const existe = T20.poderes.some(p => mesmo(p.n, t)) || T20.classes.some(c => [...(c.pod || []), ...(c.podDH || []), ...(c.podV || [])].some(x => mesmo(x[0], t)));
  return existe ? false : null;
}

// ----- efeitos -----
function novoAcc() {
  return {
    pv: 0, pm: 0, def: 0, desl: 0, deslBase: 0, rd: 0, carga: 0, penArmadura: 0, naoTreinadas: 0,
    per: {}, perAttr: {}, prof: new Set(), treina: new Map(), escolhe: [], bonus: [], marca: [], armas: [],
    defAttr: [], defAttrPesada: [], pvAttr: null, naoReduz: false, semPenArmadura: false, notas: [],
    vestidosExtra: 0, desarmado: null
  };
}
function addTreina(acc, n, f) { if (!acc.treina.has(n)) acc.treina.set(n, []); acc.treina.get(n).push(f); }
function aplicar(acc, r, fonte, chave) {
  if (!r || typeof r !== 'object') return;
  ['pv', 'pm', 'def', 'desl', 'carga', 'penArmadura'].forEach(k => { if (r[k]) acc[k] += +r[k] || 0; });
  if (r.rd) { if (typeof r.rd === 'number') acc.rd += r.rd; else acc.marca.push('RD ' + r.rd); }
  if (r.deslBase) acc.deslBase = Math.max(acc.deslBase, r.deslBase);
  if (r.per) Object.entries(r.per).forEach(([k, v]) => { if (v) acc.per[k] = (acc.per[k] || 0) + v; });
  if (r.perAttr) Object.entries(r.perAttr).forEach(([k, v]) => { acc.perAttr[k] = unico([...(acc.perAttr[k] || []), ...v]); });
  (r.prof || []).forEach(p => acc.prof.add(p));
  (r.treina || []).forEach(n => addTreina(acc, n, fonte));
  if (r.escolhePericias) {
    const e = typeof r.escolhePericias === 'number' ? { n: r.escolhePericias } : r.escolhePericias;
    acc.escolhe.push({ chave, fonte, n: e.n, de: e.de || null });
  }
  if (r.bonusPericias) acc.bonus.push({ chave, fonte, n: r.bonusPericias.n, v: r.bonusPericias.v });
  (r.marca || []).forEach(m => acc.marca.push(m));
  if (r.arma) acc.armas.push(Object.assign({ fonte }, r.arma));
  (r.defAttr || []).forEach(k => acc.defAttr.push(k));
  (r.defAttrPesada || []).forEach(k => acc.defAttrPesada.push(k));
  if (r.pvAttr) acc.pvAttr = r.pvAttr;
  if (r.naoReduz) acc.naoReduz = true;
  if (r.semPenArmadura) acc.semPenArmadura = true;
  if (r.naoTreinadas) acc.naoTreinadas = Math.max(acc.naoTreinadas, r.naoTreinadas);
  if (r.nota) acc.notas.push(r.nota);
  if (r.vestidosExtra) acc.vestidosExtra += r.vestidosExtra;
  if (r.desarmado && mediaDado(r.desarmado) > mediaDado(acc.desarmado)) acc.desarmado = r.desarmado;
}

// efeitos de itens vestidos (no máximo quatro itens vestidos dão benefício)

  'Sandálias': (ch, D) => D.cls.some(c => c.def.mag && c.def.mag.t === 'Divina') ? { pm: 1 } : {}

const SEM_LIMITE_VESTIDO = ['Mochila', 'Traje de viajante'];
function itensVestidos(ch) {
  return ch.inv.filter(i => i.equip && i.tipo === 'item' && !SEM_LIMITE_VESTIDO.includes(i.n));
}
function efeitosItens(ch, D, acc) {
  const vest = itensVestidos(ch);
  const lim = 4 + (acc.vestidosExtra || 0);
  D.limiteVestidos = lim;
  D.vestidosExcedentes = Math.max(0, vest.length - lim);

    aplicar(acc, typeof e === 'function' ? e(ch, D, acc) : e, i.n, 'item:' + i.uid);
  });
  if (D.armadura) {
    if (D.armadura.per) aplicar(acc, { per: D.armadura.per }, D.armadura.n, 'armadura');
    if (D.armadura.rd) aplicar(acc, { rd: /^\d+$/.test(D.armadura.rd) ? +D.armadura.rd : D.armadura.rd }, D.armadura.n, 'armadura');
  }
}

// ----- itens do catálogo para o inventário -----
function itemArma(a) { return { uid: novoId(), n: a.n, tipo: 'arma', cat: a.cat, prop: a.prop, emp: a.emp, dano: a.dano, crit: a.crit, alc: a.alc, dt: a.tipo, hab: (a.hab || []).slice(), esp: a.esp, preco: a.preco, f: a.f, nota: a.nota || '', qtd: 1, equip: false }; }
function itemArmadura(a) { return { uid: novoId(), n: a.n, tipo: 'armadura', peso: a.tipo, bonus: a.def, pen: a.pen, esp: a.esp, preco: a.preco, f: a.f, nota: a.nota || '', per: a.per || null, rd: a.rd || null, semReducao: !!a.semReducao, deslMetade: !!a.deslMetade, qtd: 1, equip: false }; }
function itemEscudo(a) { return { uid: novoId(), n: a.n, tipo: 'escudo', bonus: a.def, pen: a.pen, esp: a.esp, preco: a.preco, f: a.f, nota: a.nota || '', qtd: 1, equip: false }; }
function itemGeral(a) { return { uid: novoId(), n: a.n, tipo: 'item', cat: a.cat, esp: a.esp, preco: a.preco, f: a.f, nota: a.nota || '', qtd: 1, equip: false }; }
const VESTIVEIS = ['Vestuário', 'Esotérico'];
const podeEquipar = i => i.tipo !== 'item' || VESTIVEIS.includes(i.cat) || !!ITEM_EF[i.n] || /mochila|bandoleira|símbolo|organizador|cinto|colar|amuleto|patuá|condecoração|favor/i.test(i.n);

// ----- magias conhecidas por classe -----
// ritmo de aprendizado: 'nivel' (uma por nível), 'par' (uma nos níveis pares), 'impar' (uma nos níveis ímpares)
function limiteMagias(c, pods) {
  const n = c.niveis, m = c.def.mag;
  if (m.semLimite) return Infinity;
  let lim;
  if (m.lim) lim = m.lim(n);
  else if (c.id === 'arcanista') {
    const cam = c.esc.caminho;
    if (cam === 'Feiticeiro') lim = 3 + Math.floor((n - 1) / 2);
    else if (cam === 'Mago') lim = 4 + (n - 1) + (m.circ.filter(l => l <= n).length - 1);
    else lim = 3 + (n - 1);
  } else {
    const ritmo = m.ritmo || (c.id === 'bardo' || c.id === 'druida' ? 'par' : 'nivel');
    lim = ritmo === 'par' ? m.ini + Math.floor(n / 2) : ritmo === 'impar' ? m.ini + Math.floor((n - 1) / 2) : m.ini + (n - 1);
  }
  const extra = pods.filter(x => x.p.classe === c.id && (x.p.n === 'Conhecimento Mágico' || x.p.n === 'Aumentar Repertório')).length * 2;
  return lim + extra;
}
function atributoMagia(c) {
  const m = c.def.mag; if (!m) return null;
  if (m.attr !== 'caminho') return m.attr;
  const e = (c.def.esc || []).find(e => e.id === 'caminho');
  const op = e && e.op.find(o => o[0] === c.esc.caminho);
  return op && op[2] && op[2].attrMag || null;
}

function alvoDe(chave) {
  if (/^raca/.test(chave)) return 'raca';
  if (/^origem/.test(chave)) return 'origem';
  if (/^classe/.test(chave)) return 'classe';
  return 'habilidades';
}

// =========================================================
function derivar(ch) {
  const D = { pend: [], avisos: [] };
  const raca = RACA(ch.raca.id);
  const semOrigem = !!(raca && raca.semOrigem);
  const origem = semOrigem ? null : ORIGEM(ch.origem.n);
  const deus = DEUS(ch.deus);
  const cls = ch.classes.map(c => ({ id: c.id, niveis: limitar(c.niveis || 1, 1, 20), esc: c.esc || {}, def: CLASSE(c.id) })).filter(c => c.def);
  const nt = limitar(soma(cls.map(c => c.niveis)) || 1, 1, 20);
  Object.assign(D, { raca, origem, deus, cls, semOrigem, nivel: nt, patamar: T20.patamar(nt), treino: T20.bonusTreino(nt), meio: Math.floor(nt / 2) });
  // níveis numa classe (os da variante contam para a classe básica)
  D.nivelDe = id => soma(cls.filter(c => ehDaClasse(c, id)).map(c => c.niveis));
  D.classe0 = cls[0] || null;

  const pods = ch.poderes.map(p => ({ p, def: defPoder(p) }));
  D.pods = pods;

  // opções de raça escolhidas
  const racaOps = [];
  if (raca && raca.esc) for (const e of raca.esc) for (const nm of (ch.raca.esc[e.id] || [])) {
    const op = e.op.find(o => o[0] === nm); if (op) racaOps.push({ e, op, x: op[2] || {} });
  }
  D.racaOps = racaOps;

  // ===== atributos =====
  const brk = {}; ATR.forEach(k => { brk[k] = { base: 0, raca: 0, origem: 0, classe: 0, poderes: 0, tormenta: 0, ajuste: 0 }; });
  const met = ch.atr.metodo;
  if (met === 'rolagem') ATR.forEach(k => { const i = ch.atr.rolAtr[k]; const r = ch.atr.rol[i]; brk[k].base = (i != null && r) ? r.mod : 0; });
  else ATR.forEach(k => { brk[k].base = +ch.atr.base[k] || 0; });
  if (met === 'pontos') {
    D.pontosGastos = soma(ATR.map(k => T20.custoPontos[String(limitar(brk[k].base, -1, 4))] || 0));
    D.pontosRestantes = 10 - D.pontosGastos;
  }
  D.racaLivre = [];
  if (raca) {
    Object.entries(raca.attr || {}).forEach(([k, v]) => { brk[k].raca += v; });
    racaOps.forEach(o => Object.entries(o.x.attr || {}).forEach(([k, v]) => { brk[k].raca += v; }));
    const vals = [...(raca.livreAlt ? (raca.livreAlt[ch.raca.livreAlt || 0] || []) : (raca.livre || [])), ...racaOps.flatMap(o => o.x.livre || [])];
    D.racaLivre = vals;
    const escolhidos = ch.raca.livre.filter(k => ATR.includes(k)).slice(0, vals.length);
    escolhidos.forEach((k, i) => { brk[k].raca += vals[i]; });
    if (escolhidos.length < vals.length) D.pend.push({ txt: 'Escolha ' + plural(vals.length - escolhidos.length, 'atributo') + ' para o bônus da raça', alvo: 'raca' });
  }
  if (origem && origem.regional) {
    Object.entries(origem.attr || {}).forEach(([k, v]) => { brk[k].origem += v; });
    if (origem.livre) {
      const escolhidos = ch.origem.livre.filter(k => ATR.includes(k)).slice(0, origem.livre.length);
      escolhidos.forEach((k, i) => { brk[k].origem += origem.livre[i]; });
      if (escolhidos.length < origem.livre.length) D.pend.push({ txt: 'Escolha o atributo do benefício da origem', alvo: 'origem' });
    }
  }
  // habilidades de classe que dão atributo (5º campo da habilidade; ou atr numa opção escolhida)
  cls.forEach(c => {
    const cx = { nc: c.niveis, esc: c.esc };
    const somar = a => { if (typeof a === 'function') a = a(cx); Object.entries(a || {}).forEach(([k, v]) => { if (brk[k]) brk[k].classe += +v || 0; }); };
    c.def.hab.forEach(h => { if (h[1] <= c.niveis && h[4]) somar(h[4]); });
    (c.def.esc || []).forEach(e => { if ((e.nivel || 1) <= c.niveis) escolhidasDe(c, e).forEach(op => { if (op[2] && op[2].atr) somar(op[2].atr); }); });
  });
  pods.forEach(({ p }) => {
    if (p.n !== 'Aumento de Atributo') return;
    if (ATR.includes(p.op)) brk[p.op].poderes += 1;
    else D.pend.push({ txt: 'Escolha o atributo do Aumento de Atributo', alvo: 'habilidades' });
  });
  const torm = pods.filter(x => x.p.tipo === 'Tormenta');
  // lefou: bônus de Deformidade trocados por poderes da Tormenta não reduzem Carisma
  let trocasLefou = 0;
  if (raca && raca.id === 'lefou') Object.keys(ch.escolhas).forEach(k => { if (k.startsWith('b:raca:')) trocasLefou += (ch.escolhas[k] || []).filter(v => v === TROCA).length; });
  torm.forEach((x, i) => { x.semPerda = !!x.p.semPerdaCar || i < trocasLefou; });
  const nPerda = torm.filter(x => !x.semPerda).length;
  let perda = nPerda > 0 ? 1 + Math.floor((nPerda - 1) / 2) : 0;
  if (perda > 0 && pods.some(x => x.p.n === 'Afinidade com a Tormenta')) perda -= 1;
  brk.car.tormenta = -perda;
  const nTormenta = torm.length + (raca && raca.id === 'lefou' ? Math.max(0, 2 - Math.min(2, trocasLefou)) : 0);
  D.nTormenta = nTormenta;
  ATR.forEach(k => { brk[k].ajuste = +ch.atr.ajuste[k] || 0; });
  const at = {};
  ATR.forEach(k => { const b = brk[k]; at[k] = b.base + b.raca + b.origem + b.classe + b.poderes + b.tormenta + b.ajuste; });
  D.at = at; D.atBrk = brk;

  // ===== equipamento em uso =====
  const armI = ch.inv.find(i => i.equip && i.tipo === 'armadura') || null;
  const escI = ch.inv.find(i => i.equip && i.tipo === 'escudo') || null;
  D.armadura = armI; D.escudo = escI;
  D.pesada = !!(armI && armI.peso === 'pesada');
  if (ch.inv.filter(i => i.equip && i.tipo === 'armadura').length > 1) D.avisos.push('Só uma armadura pode ser vestida por vez; vale a primeira da lista.');
  if (ch.inv.filter(i => i.equip && i.tipo === 'escudo').length > 1) D.avisos.push('Só um escudo pode ser usado por vez; vale o primeiro da lista.');

  // ===== efeitos =====
  const acc = novoAcc();
  const nomesPod = pods.map(x => x.p.n);
  const ctx0 = {
    nt, at, pesada: D.pesada, armadura: armI, escudo: escI, nTormenta,
    conta: re => nomesPod.filter(n => re.test(n)).length,
    contaPre: nm => pods.filter(x => x.def && (x.def.pre || '').includes(nm)).length
  };
  const run = (fn, nc, fonte, chave, op) => {
    if (typeof fn !== 'function') return;
    let r; try { r = fn(Object.assign({}, ctx0, { nc }), op); } catch (e) { console.warn('efeito', fonte, e); return; }
    aplicar(acc, r, fonte, chave);
  };
  if (raca) {
    raca.hab.forEach(h => run(h[2], nt, raca.n, 'raca:' + h[0]));
    racaOps.forEach(o => run(o.x.ef, nt, raca.n + ' (' + o.op[0] + ')', 'raca:' + o.e.id + ':' + o.op[0]));
  }
  if (origem && origem.regional) run(origem.ef, nt, origem.n, 'origem:' + origem.n);
  cls.forEach((c, i) => {
    c.def.hab.forEach(h => { if (h[1] <= c.niveis) run(h[3], c.niveis, h[0], 'classe:' + c.id + ':' + h[0]); });
    (c.def.esc || []).forEach(e => {
      if ((e.nivel || 1) > c.niveis) return;
      escolhidasDe(c, e).forEach(op => { if (op[2]) run(op[2].ef, c.niveis, c.def.n, 'classe:' + c.id + ':' + e.id + (e.multi ? ':' + op[0] : '')); });
    });
    run(c.def.ef, c.niveis, c.def.n, 'classe:' + c.id);
    if (i === 0) (c.def.prof || []).forEach(p => acc.prof.add(p));
  });
  pods.forEach(({ p, def }) => {
    if (!def) return;
    const nc = p.tipo === 'Classe' ? (D.nivelDe(p.classe) || nt) : nt;
    run(def.ef, nc, def.n, 'pod:' + p.uid, p.op);
    if (def.treinaEscolha && p.txt && perValida(p.txt)) addTreina(acc, p.txt, def.n);
  });
  efeitosItens(ch, D, acc);
  if (D.vestidosExcedentes) D.avisos.push('Mais de ' + D.limiteVestidos + ' itens vestidos: só os ' + D.limiteVestidos + ' primeiros da lista dão benefício.');
  D.acc = acc;
  D.prof = new Set([...acc.prof].map(p => normal(p)));
  const def0 = cls[0] ? cls[0].def : null;
  D.armasPermitidas = def0 && def0.armasPermitidas ? new Set(def0.armasPermitidas.map(normal)) : null;
  D.semLeve = !!(def0 && def0.semLeve);
  D.naoProfArm = !!((D.pesada && !D.prof.has('pesadas')) || (armI && !D.pesada && D.semLeve) || (escI && !D.prof.has('escudos')));
  if (D.naoProfArm) D.avisos.push('Sem proficiência com a armadura ou o escudo em uso: a penalidade de armadura vale para todas as perícias de Força e Destreza.');

  // ===== perícias treinadas =====
  const trein = new Map();
  const addT = (n, f) => { if (!n) return; if (!trein.has(n)) trein.set(n, []); trein.get(n).push(f); };
  const c0 = cls[0];
  D.perClasse = null;
  if (c0) {
    const pc = c0.def.per;
    pc.fix.forEach(n => addT(n, c0.def.n));
    (pc.ou || []).forEach((par, i) => {

    });
    const escolhidas = ch.pericias.classe.filter(n => pc.de.includes(n) || (ehOficio(n) && pc.de.includes('Ofício'))).slice(0, pc.n);
    escolhidas.forEach(n => addT(n, c0.def.n));
    D.perClasse = { n: pc.n, de: pc.de, escolhidas };
    if (escolhidas.length < pc.n) D.pend.push({ txt: 'Escolha ' + plural(pc.n - escolhidas.length, 'perícia') + ' de ' + c0.def.n, alvo: 'classe' });
  }
  const nInt = Math.max(0, at.int);
  const intEsc = ch.pericias.int.filter(perValida).slice(0, nInt);
  intEsc.forEach(n => addT(n, 'Inteligência'));
  D.perInt = { n: nInt, escolhidas: intEsc };
  if (c0 && intEsc.length < nInt) D.pend.push({ txt: 'Escolha ' + plural(nInt - intEsc.length, 'perícia') + ' pela Inteligência', alvo: 'classe' });
  acc.treina.forEach((fs, n) => fs.forEach(f => addT(n, f)));
  if (origem && !origem.regional) ch.origem.ben.forEach(n => addT(n, origem.n));
  acc.escolhe.forEach(e => {
    const lista = (ch.escolhas[e.chave] || []).filter(n => perValida(n) || n === TROCA).slice(0, e.n);
    lista.forEach(n => { if (n !== TROCA) addT(n, e.fonte); });
    if (lista.length < e.n) D.pend.push({ txt: 'Escolha ' + plural(e.n - lista.length, 'perícia') + ' (' + e.fonte + ')', alvo: alvoDe(e.chave) });
  });
  ch.pericias.extra.forEach(n => addT(n, 'adicionada à mão'));
  D.trein = trein;
  const bonusEsc = {};
  acc.bonus.forEach(b => {
    const lista = (ch.escolhas['b:' + b.chave] || []).filter(n => perValida(n) || n === TROCA).slice(0, b.n);
    lista.forEach(n => { if (n !== TROCA) bonusEsc[n] = (bonusEsc[n] || 0) + b.v; });
    if (lista.length < b.n) D.pend.push({ txt: 'Escolha ' + plural(b.n - lista.length, 'perícia') + ' para o bônus de ' + sinal(b.v) + ' (' + b.fonte + ')', alvo: alvoDe(b.chave) });
  });
  if (trein.has('Ofício')) D.pend.push({ txt: 'Defina qual é o seu Ofício', alvo: 'classe' });
  D.oficios = unico([...trein.keys()].filter(n => ehOficio(n) && n !== 'Ofício')).sort();

  // ===== tamanho, carga, penalidade, deslocamento =====
  let tam = (raca && raca.tam) || 'Médio';
  racaOps.forEach(o => { if (o.x.tam) tam = o.x.tam; });
  D.tam = tam;
  const tamI = T20.tamanhos[tam] || T20.tamanhos['Médio'];
  let deslBase = (raca && raca.desl) || 9;
  racaOps.forEach(o => { if (o.x.desl) deslBase = o.x.desl; });
  if (acc.deslBase) deslBase = Math.max(deslBase, acc.deslBase);
  const limBase = at.for >= 0 ? 10 + 2 * at.for : 10 + at.for;
  const limite = Math.max(0, limBase + acc.carga + (+ch.ajustes.carga || 0));
  const usado = soma(ch.inv.map(i => (+i.esp || 0) * (+i.qtd || 0))) + Math.floor((+ch.dinheiro || 0) / 1000);
  D.carga = { usado: Math.round(usado * 10) / 10, limite, max: limite * 2, sobre: usado > limite, excesso: usado > limite * 2 };
  if (D.carga.excesso) D.avisos.push('Carga acima do máximo: você não consegue carregar tudo isso.');
  let pen = 0;
  if (armI && !acc.semPenArmadura) pen += +armI.pen || 0;
  if (escI) pen += +escI.pen || 0;
  pen += acc.penArmadura;
  if (D.carga.sobre) pen -= 5;
  D.pen = Math.min(0, pen);
  let desl = deslBase + acc.desl + (+ch.ajustes.desl || 0);
  const naoReduzArm = acc.naoReduz || (armI && armI.semReducao) || pods.some(x => x.p.n === 'Fanático');
  if (D.pesada && !naoReduzArm) desl = armI.deslMetade ? Math.floor(desl / 2 / 1.5) * 1.5 : desl - 3;
  if (D.carga.sobre && !acc.naoReduz) desl -= 3;
  D.desl = Math.max(0, desl); D.deslBase = deslBase;

  // ===== perícias =====
  function calcPericia(n) {
    const b = perDef(n);
    const alts = unico([b.a, ...(acc.perAttr[n] || []), ...(ehOficio(n) ? (acc.perAttr['Ofício'] || []) : [])]).filter(k => ATR.includes(k));
    const k = alts.reduce((x, y) => at[y] > at[x] ? y : x, b.a);
    const treinada = trein.has(n);
    const usavel = treinada || !b.so;
    let tot = D.meio + at[k];
    const partes = ['metade do nível ' + sinalV(D.meio), ATRA[k] + ' ' + sinalV(at[k])];
    if (treinada) { tot += D.treino; partes.push('treino ' + sinal(D.treino)); }
    let bon = (acc.per[n] || 0) + (ehOficio(n) && n !== 'Ofício' ? (acc.per['Ofício'] || 0) : 0) + (bonusEsc[n] || 0);
    if (!treinada && acc.naoTreinadas) bon += acc.naoTreinadas;
    if (bon) { tot += bon; partes.push('bônus ' + sinal(bon)); }
    const aj = +ch.ajustes.per[n] || 0;
    if (aj) { tot += aj; partes.push('ajuste ' + sinal(aj)); }
    let p = 0;
    if (D.pen && (b.pen || (D.naoProfArm && (k === 'for' || k === 'des')))) p = D.pen;
    if (p) { tot += p; partes.push('armadura ' + sinal(p)); }
    if (n === 'Furtividade' && tamI.furt) { tot += tamI.furt; partes.push('tamanho ' + sinal(tamI.furt)); }
    return { n, a: k, treinada, usavel, so: b.so, pen: b.pen && !!p, tot, partes, fontes: trein.get(n) || [] };
  }
  const nomesPer = [];
  PER.forEach(p => {
    if (p.n !== 'Ofício') { nomesPer.push(p.n); return; }
    if (D.oficios.length) nomesPer.push(...D.oficios);
    if (!D.oficios.length || trein.has('Ofício')) nomesPer.push('Ofício');
  });
  D.pericias = nomesPer.map(calcPericia);
  D.per = Object.fromEntries(D.pericias.map(p => [p.n, p]));
  D.calcPericia = calcPericia;

  // ===== conjuradores =====
  D.conj = cls.filter(c => c.def.mag && (!c.def.mag.desde || c.niveis >= c.def.mag.desde)).map(c => {
    const m = c.def.mag;
    const k = atributoMagia(c);
    const circ = m.circ.filter(l => l <= c.niveis).length;
    const conhecidas = ch.magias.filter(x => x.classe === c.id).length;
    const limite = limiteMagias(c, pods);
    const escolas = m.escolas ? (ch.escolas[c.id] || []).slice(0, m.escolas) : null;
    if (m.escolas && escolas.length < m.escolas) D.pend.push({ txt: 'Escolha ' + plural(m.escolas - escolas.length, 'escola') + ' de magia de ' + c.def.n, alvo: 'classe' });
    const semLimite = !isFinite(limite);
    if (m.regra) { const r = m.regra(ch.magias.filter(x => x.classe === c.id).map(x => MAGIA(x.n)).filter(Boolean)); if (r) D.avisos.push(c.def.n + ': ' + r); }
    if (!semLimite && conhecidas < limite) D.pend.push({ txt: 'Escolha ' + plural(limite - conhecidas, 'magia') + ' de ' + c.def.n, alvo: 'magias' });
    if (!semLimite && conhecidas > limite) D.avisos.push(c.def.n + ': ' + plural(conhecidas, 'magia') + ' conhecidas, acima das ' + limite + ' previstas para o nível.');
    return { id: c.id, n: c.def.n, t: m.t, k, circ, cd: k ? 10 + D.meio + at[k] : null, conhecidas, limite, semLimite, escolas, nEsc: m.escolas || 0, aprende: m.aprende, somaPM: !!m.pm, filtro: m.filtro || null, tiposTxt: m.tiposTxt || null };
  });
  D.limitePM = nt;

  // ===== PV e PM =====
  const kPV = acc.pvAttr && ATR.includes(acc.pvAttr) ? acc.pvAttr : 'con';
  D.kPV = kPV;
  let pv = 0;
  cls.forEach((c, i) => {
    for (let lv = 1; lv <= c.niveis; lv++) pv += (i === 0 && lv === 1) ? c.def.pv + at[kPV] : Math.max(1, c.def.pvn + at[kPV]);
  });
  pv += acc.pv + (+ch.ajustes.pv || 0);
  D.pvMax = cls.length ? Math.max(1, pv) : 0;
  let pm = soma(cls.map(c => c.def.pm * c.niveis));
  D.conj.forEach(cj => { if (cj.somaPM && cj.k) pm += at[cj.k]; });
  pm += acc.pm + (+ch.ajustes.pm || 0);
  D.pmMax = cls.length ? Math.max(0, pm) : 0;
  D.pvAtual = ch.pv.atual == null ? D.pvMax : ch.pv.atual;
  D.pmAtual = ch.pm.atual == null ? D.pmMax : ch.pm.atual;

  // ===== defesa e RD =====
  let kDef = null;
  if (D.pesada) { if (acc.defAttrPesada.length) kDef = acc.defAttrPesada.reduce((b, k) => at[k] > at[b] ? k : b); }
  else kDef = ['des', ...acc.defAttr].reduce((b, k) => at[k] > at[b] ? k : b, 'des');
  const vAt = kDef ? at[kDef] : 0;
  const vArm = armI ? (+armI.bonus || 0) : 0;
  const vEsc = escI ? (+escI.bonus || 0) : 0;
  D.def = 10 + vAt + vArm + vEsc + acc.def + (+ch.ajustes.def || 0);
  D.defBrk = ['10', kDef ? ATRA[kDef] + ' ' + sinalV(vAt) : '', armI ? 'armadura ' + sinal(vArm) : '', escI ? 'escudo ' + sinal(vEsc) : '', acc.def ? 'outros ' + sinal(acc.def) : '', ch.ajustes.def ? 'ajuste ' + sinal(+ch.ajustes.def) : ''].filter(Boolean);
  D.rd = acc.rd + (+ch.ajustes.rd || 0);

  // ===== ataques =====
  const tem = n => pods.some(x => mesmo(x.p.n, n));
  const focos = pods.filter(x => x.p.n === 'Foco em Arma' && x.p.txt).map(x => normal(x.p.txt));
  const proficiente = w => {
    if (w.natural || w.desarmado) return true;
    const nm = normal(w.n);
    if ([...D.prof].some(p => p === nm || (p.length > 3 && nm.startsWith(p)))) return true;
    if (w.cat === 'simples') return !D.armasPermitidas || D.armasPermitidas.has(nm);
    if (w.cat === 'marcial') return D.prof.has('marciais') || (D.prof.has('marciais (corpo a corpo)') && w.prop === 'cc');
    if (w.cat === 'exotica') return D.prof.has('exoticas');
    if (w.cat === 'fogo') return D.prof.has('fogo') || (D.prof.has('fogo-leve') && (w.emp === 'L' || w.emp === '1'));
    return true;
  };
  const armas = ch.inv.filter(i => i.tipo === 'arma' && i.equip).map(i => Object.assign({}, i));
  acc.armas.forEach(a => armas.push({ n: a.n, natural: true, cat: 'natural', prop: 'cc', emp: 'L', dano: a.dano, crit: a.crit || 'x2', dt: a.tipo, alc: '—', hab: [], nota: 'Arma natural (' + a.fonte + ')' }));
  const manopla = ch.inv.some(i => i.equip && /^(Manopla|Garra feroz)$/.test(i.n));
  const estDes = tem('Estilo Desarmado');
  const danoDes = [acc.desarmado, estDes ? '1d6' : '1d3'].reduce((a, b) => mediaDado(b) > mediaDado(a) ? b : a);
  armas.push({ n: 'Ataque desarmado', desarmado: true, cat: 'natural', prop: 'cc', emp: 'L', dano: danoDes, crit: 'x2', dt: 'Impacto' + (acc.desarmado ? ', letal ou não letal' : manopla || estDes ? '' : ', não letal'), alc: '—', hab: [] });
  D.ataques = armas.map(w => {
    const hab = w.hab || [];
    const melee = w.prop === 'cc', arremesso = w.prop === 'ar', disparo = w.prop === 'dp';
    const per = D.per[melee ? 'Luta' : 'Pontaria'];
    let atk = per.tot, kAtk = per.a;
    const obs = [];
    const leveAgil = w.emp === 'L' || hab.includes('agil');
    const acuidade = tem('Acuidade com Arma') && leveAgil;
    let kDano = (melee || arremesso) ? 'for' : null;
    if (melee && (acuidade || hab.includes('des')) && at.des > at[kAtk]) { atk += at.des - at[kAtk]; kAtk = 'des'; }
    if ((melee || arremesso) && tem('Acuidade com Arma') && (leveAgil || arremesso) && at.des > at.for) kDano = 'des';
    if (arremesso && tem('Arremesso Potente') && at.for > at[kAtk]) { atk += at.for - at[kAtk]; kAtk = 'for'; kDano = 'for'; }
    if (disparo && hab.includes('somaFor')) kDano = 'for';
    if (!proficiente(w)) { atk -= 5; obs.push('sem proficiência (−5)'); }
    if (hab.includes('desbalanceada')) { atk -= 2; obs.push('desbalanceada (−2)'); }
    if (!w.natural && !w.desarmado && focos.some(f => normal(w.n) === f || normal(w.n).startsWith(f) || f.startsWith(normal(w.n)))) { atk += 2; obs.push('Foco em Arma (+2)'); }
    let bd = kDano ? at[kDano] : 0;
    if (disparo && tem('Estilo de Disparo')) { bd += at.des; obs.push('Estilo de Disparo'); }
    if (arremesso && tem('Estilo de Arremesso')) { bd += 2; obs.push('Estilo de Arremesso (+2 dano)'); }
    if (melee && w.emp === '2' && tem('Estilo de Duas Mãos')) { bd += 5; obs.push('Estilo de Duas Mãos (+5 dano)'); }
    const temDano = w.dano && w.dano !== '—';
    const sufixo = bd ? (bd > 0 ? '+' : '−') + Math.abs(bd) : '';
    return {
      w, n: w.n, atk, kAtk, crit: w.crit || 'x2', dt: w.dt || '', alc: w.alc || '—', obs,
      dano: temDano ? w.dano.split('/').map(x => x + sufixo).join(' / ') : '—',
      danoExpr: temDano ? w.dano.split('/')[0] + (bd ? (bd > 0 ? '+' : '-') + Math.abs(bd) : '') : null,
      per: melee ? 'Luta' : 'Pontaria'
    };
  });

  // ===== poderes por classe, devoção =====
  D.slotsClasse = cls.map(c => {
    const total = c.def.niv.slice(0, c.niveis).reduce((s, txt) => s + txt.split(/,\s*/).filter(t => t.trim() === 'P').length, 0);
    const usados = ch.poderes.filter(p => p.slot === 'classe:' + c.id).length;
    if (usados < total) D.pend.push({ txt: 'Escolha ' + plural(total - usados, 'poder', 'poderes') + ' de ' + c.def.n, alvo: 'classe' });
    if (usados > total) D.avisos.push(c.def.n + ': ' + plural(usados, 'poder', 'poderes') + ' de classe escolhidos, mas o nível dá ' + total + '.');
    return { id: c.id, n: c.def.n, total, usados };
  });
  let concedidosN = 0, devocaoObrig = false, semDeus = false;
  const cDev = cls.find(c => c.def.devoto);
  D.classeDevota = cDev || null;
  if (cDev) {
    const e = (cDev.def.esc || []).find(e => e.id === 'devocao');
    const idx = e ? e.op.findIndex(o => o[0] === cDev.esc.devocao) : 0; // sem opção de devoção: deus obrigatório
    if (idx === 0) { devocaoObrig = true; concedidosN = cDev.def.devoto; }
    else if (idx > 0) semDeus = true;
  }
  if (deus && !concedidosN && !semDeus) concedidosN = 1;
  if (semDeus && deus) concedidosN = 0;
  D.semDeus = semDeus;
  if (devocaoObrig && !deus) D.pend.push({ txt: 'Escolha a divindade de ' + cDev.def.n, alvo: 'deus' });
  const nConc = ch.poderes.filter(p => p.slot === 'concedido').length;
  D.concedidos = { n: concedidosN, usados: nConc };
  if (deus && nConc < concedidosN) D.pend.push({ txt: 'Escolha ' + plural(concedidosN - nConc, 'poder concedido', 'poderes concedidos') + ' de ' + deus.n, alvo: 'deus' });
  if (deus) cls.forEach(c => {
    if (c.def.naoDevoto) D.avisos.push(c.def.n + ' não pode ser devoto de nenhum deus.');
    else if ((c.def.deusesPermitidos && !c.def.deusesPermitidos.includes(deus.n)) || (c.def.deusesProibidos || []).includes(deus.n)) D.avisos.push(c.def.n + ' não pode ser devoto de ' + deus.n + '.');
  });
  if (ch.poderes.some(p => p.slot === 'concedido') && !deus) D.avisos.push('Há poderes concedidos sem divindade escolhida.');

  // ===== pendências gerais =====
  if (!raca) D.pend.unshift({ txt: 'Escolha uma raça', alvo: 'raca' });
  else if (raca.esc) raca.esc.forEach(e => {
    const q = e.multi || 1; const sel = (ch.raca.esc[e.id] || []).length;
    if (sel < q) D.pend.push({ txt: 'Escolha ' + (q > 1 ? (q - sel) + ' de ' + q + ' opções' : 'uma opção') + ' em ' + e.n.replace(/\s*\(escolha \d+\)/i, ''), alvo: 'raca' });
  });
  if (!semOrigem) {
    if (!origem) D.pend.push({ txt: 'Escolha uma origem', alvo: 'origem' });
    else if (!origem.regional) {
      const nb = ch.origem.ben.length + ch.poderes.filter(p => p.slot === 'origem').length;
      if (nb < 2) D.pend.push({ txt: 'Escolha ' + plural(2 - nb, 'benefício') + ' da origem', alvo: 'origem' });
      if (nb > 2) D.avisos.push('A origem permite apenas 2 benefícios.');
    }
  }
  if (!cls.length) D.pend.push({ txt: 'Escolha uma classe', alvo: 'classe' });
  cls.forEach(c => (c.def.esc || []).forEach(e => {
    if ((e.nivel || 1) > c.niveis) return;
    const q = qtdEscolha(e, c.niveis), sel = escolhidasDe(c, e).length;
    if (sel < q) D.pend.push({ txt: 'Escolha ' + (q > 1 ? plural(q - sel, 'opção', 'opções') + ' em ' : '') + e.n + ' (' + c.def.n + ')', alvo: 'classe' });
    if (sel > q) D.avisos.push(c.def.n + ': ' + e.n + ' tem ' + sel + ' escolhas, mas o nível dá ' + q + '.');
  }));
  pods.forEach(({ p }) => {
    const d = p.tipo === 'Classe' ? CLASSE(p.slot && /^classe:/.test(p.slot) ? p.slot.slice(7) : p.classe) : null;
    if (d && (d.podProibidos || []).includes(p.n)) D.avisos.push(d.n + ' não pode escolher o poder ' + p.n + '.');
  });
  if (met === 'pontos' && D.pontosRestantes !== 0) D.pend.push({ txt: D.pontosRestantes > 0 ? 'Distribua ' + plural(D.pontosRestantes, 'ponto') + ' de atributo' : 'Você gastou ' + plural(-D.pontosRestantes, 'ponto') + ' a mais nos atributos', alvo: 'atributos' });
  if (met === 'rolagem') {
    if (ch.atr.rol.length < 6) D.pend.push({ txt: 'Role os atributos', alvo: 'atributos' });
    else { const faltam = ATR.filter(k => ch.atr.rolAtr[k] == null).length; if (faltam) D.pend.push({ txt: 'Distribua ' + plural(faltam, 'rolagem', 'rolagens') + ' entre os atributos', alvo: 'atributos' }); }
  }
  pods.forEach(({ p, def }) => {
    if (!def) return;
    if (def.op && def.n !== 'Aumento de Atributo' && !p.op) D.pend.push({ txt: 'Escolha a opção de ' + def.n, alvo: 'habilidades' });
    if (def.txt && !p.txt) D.pend.push({ txt: 'Defina ' + def.txt.toLowerCase() + ' de ' + def.n, alvo: 'habilidades' });
  });
  if (!String(ch.nome || '').trim()) D.pend.push({ txt: 'Dê um nome ao personagem', alvo: 'nome' });

  // ===== nomes conhecidos (para pré-requisitos) =====
  const conhecidos = new Set();
  pods.forEach(x => conhecidos.add(normal(x.p.n)));
  cls.forEach(c => {
    c.def.hab.forEach(h => { if (h[1] <= c.niveis) conhecidos.add(normal(h[0])); });
    Object.values(c.esc || {}).forEach(v => (Array.isArray(v) ? v : [v]).forEach(x => conhecidos.add(normal(x))));
    (c.def.contaComo || []).forEach(([nome, nv]) => { if ((nv || 1) <= c.niveis) conhecidos.add(normal(nome)); });
  });
  if (raca) raca.hab.forEach(h => conhecidos.add(normal(h[0])));
  racaOps.forEach(o => conhecidos.add(normal(o.op[0])));
  ch.magias.forEach(m => conhecidos.add(normal(m.n)));
  D.temNome = t => conhecidos.has(normal(t));
  D.preDe = def => checarPre(def && def.pre, D);
  pods.forEach(x => { if (x.def && x.def.pre && x.p.slot !== 'origem') { const r = checarPre(x.def.pre, D); x.pre = r; if (r.ok === false) D.avisos.push(x.def.n + ': pré-requisito não atendido (' + r.itens.filter(i => i.ok === false).map(i => i.t).join(', ') + ').'); } });

  D.marcas = unico(acc.marca);
  return D;
}

// ----- opções de perícia para <select> -----
function opcoesPericia(lista, atual, usadas) {
  const base = (lista || PER.map(p => p.n));

  const nomes = base.filter(n => !ehOficio(n));
  let h = '<option value="">Escolher…</option>';
  h += nomes.map(n => `<option value="${esc(n)}"${n === atual ? ' selected' : ''}${usadas && usadas.includes(n) && n !== atual ? ' disabled' : ''}>${esc(n)}</option>`).join('');
  if (temOficio) {
    const variantes = base.filter(n => ehOficio(n) && n !== 'Ofício');
    const ofs = base.includes('Ofício') ? OFICIOS.map(o => 'Ofício (' + o + ')') : variantes;
    h += `<optgroup label="Ofício">` + ofs.map(n => `<option value="${esc(n)}"${n === atual ? ' selected' : ''}${usadas && usadas.includes(n) && n !== atual ? ' disabled' : ''}>${esc(n)}</option>`).join('') + `</optgroup>`;
  }
  return h;
}
function seletoresPericia(n, chave, lista, escolhidas, act, troca) {
  let h = '<div class="chips">';
  for (let i = 0; i < n; i++) {
    const v = escolhidas[i] || '';
    const extra = troca ? `<option value="${esc(TROCA)}"${v === TROCA ? ' selected' : ''}>Troquei por um poder</option>` : '';
    h += `<select class="sel" data-act="${act || 'esc-per'}" data-chave="${esc(chave)}" data-i="${i}" aria-label="Perícia ${i + 1}">${opcoesPericia(lista, v, escolhidas)}${extra}</select>`;
  }
  return h + '</div>';
}

// como a tabela de progressão chama cada poder de classe (variantes usam a lista da classe básica)

function painelRaca() {

  }

  if (vals.length) {

    atr += `<div class="chips">${ATR.map(k => chip(ATRN[k] + (sel.includes(k) ? ' ' + sinal(vals[sel.indexOf(k)]) : ''), 'raca-livre', `data-k="${k}"`, sel.includes(k), exc.includes(k) || (!sel.includes(k) && sel.length >= vals.length))).join('')}</div>`;

function escolhasEfeito(prefixo) {

function painelOrigem() {
  if (DV.semOrigem) return bloco('', `<p>${esc(DV.raca.n)} não tem origem: a raça substitui esse passo.</p>`);
  const o = DV.origem;
  if (!o) return vazioPainel('A origem conta o que você fazia antes de ser aventureiro e dá benefícios.', 'Ver origens', 'abrir-origem');
  let h = cabPainel(o.n, o.regional ? 'Origem regional, ' + fonteNomeCurto(o.f) : fonteNomeCurto(o.f), 'Trocar origem', 'abrir-origem');
  h += `<p class="desc">Itens: ${esc(o.itens)}</p>`;
  if (o.regional) {
    let b = `<p>${esc(o.ben)}</p>`;
    if (o.livre) {
      const sel = ch.origem.livre.slice(0, o.livre.length);
      b += `<div class="chips">${ATR.map(k => chip(ATRN[k], 'origem-livre', `data-k="${k}"`, sel.includes(k), !sel.includes(k) && sel.length >= o.livre.length)).join('')}</div>`;
    }
    h += bloco('Benefício', b);
  } else {
    const bens = origemBeneficios(o);
    const podsOrig = ch.poderes.filter(p => p.slot === 'origem');
    const nEsc = ch.origem.ben.length + podsOrig.length;

        return chip(esc(marcado || b.n), 'origem-per', `data-per="${esc(b.n)}"`, !!marcado, cheio && !marcado, 'Perícia treinada');
      }
      if (b.tipo === 'pod') {
        const p = podsOrig.find(x => mesmo(x.n, b.n));
        return chip(esc(b.n) + ' <small>poder</small>', 'origem-pod', `data-n="${esc(b.n)}" data-ptipo="${esc(b.ptipo)}"`, !!p, cheio && !p, b.def ? b.def.r : '');
      }
      const listados = bens.filter(x => x.tipo === 'pod').map(x => normal(x.n));
      const p = podsOrig.find(x => x.tipo === b.ptipo && !listados.includes(normal(x.n)));
      return chip(esc(b.n) + (p ? ': ' + esc(p.n) : ''), 'origem-gen', `data-ptipo="${esc(b.ptipo)}"${p ? ` data-uid="${p.uid}"` : ''}`, !!p, cheio && !p);
    }).join('');
    h += bloco('Benefícios', `<p class="desc">Escolha dois entre as perícias e os poderes abaixo.</p><div class="chips">${chips}</div>`, `${nEsc} de 2`);

    if (o.unico) h += bloco('Poder único: ' + esc(o.unico[0]), `<p>${esc(o.unico[1])}</p>`);
    podsOrig.forEach(p => { const d = defPoder(p); if (d && !(o.unico && mesmo(d.n, o.unico[0]))) h += `<p class="op-desc"><b>${esc(d.n)}.</b> ${esc(d.r)}</p>`; });

  h += escolhasEfeito('origem');
  return h;

        return;
      }
      if (e.multi) {
        const q = qtdEscolha(e, c.niveis), sel = Array.isArray(c.esc[e.id]) ? c.esc[e.id] : [];
        h += bloco(esc(e.n), opcoesLinhas(e.op, 'classe-esc', o => `data-i="${i}" data-e="${esc(e.id)}" data-op="${esc(o[0])}"`, o => sel.includes(o[0]), () => sel.length >= q), `escolha ${q} (${sel.length} de ${q})` + (desde ? ', ' + desde : ''));
        return;
      }
      h += bloco(esc(e.n), opcoesLinhas(e.op, 'classe-esc', o => `data-i="${i}" data-e="${esc(e.id)}" data-op="${esc(o[0])}"`, o => c.esc[e.id] === o[0]), desde);
    });
    if (d.mag && d.mag.escolas) {
      const sel = (ch.escolas[c.id] || []);
      h += bloco('Escolas de magia', `<div class="chips">${T20.escolasMagia.map(s => chip(esc(s), 'classe-escola', `data-id="${c.id}" data-s="${esc(s)}"`, sel.includes(s), !sel.includes(s) && sel.length >= d.mag.escolas)).join('')}</div>`, `escolha ${d.mag.escolas}`);
    }
    const sl = DV.slotsClasse[i];
    const pods = ch.poderes.filter(p => p.slot === 'classe:' + c.id);
    h += bloco('Poderes de ' + esc(d.n), (pods.length ? `<ul class="lista-habs">${pods.map(p => `<li><b>${esc(p.n)}</b>${p.op ? ' (' + esc(ATRN[p.op] || p.op) + ')' : ''}${p.txt ? ' (' + esc(p.txt) + ')' : ''} <button class="btn-remover" data-act="pod-remover" data-uid="${p.uid}">remover</button></li>`).join('')}</ul>` : '') +
      `<div class="linha-acoes"><button class="btn${sl.usados < sl.total ? ' btn-pri' : ''}" data-act="abrir-poder" data-slot="classe:${c.id}">Escolher poder</button><span class="desc">Em cada nível com poder, você pode pegar um ${esc(rotuloPoder(d))} ou um poder geral.</span></div>`, `${sl.usados} de ${sl.total}`);
    h += escolhasEfeito('classe:' + c.id);
  });
  h += `<div class="linha-acoes"><button class="btn" data-act="abrir-classe" data-multi="1"${total >= 20 ? ' disabled' : ''}>Adicionar outra classe</button></div>`;
  return h;
}

function painelDeus() {
  const d = DV.deus;
  const cDev = DV.classeDevota;
  let aviso = '';
  if (cDev) {
    const temEsc = (cDev.def.esc || []).some(e => e.id === 'devocao');
    const op = cDev.esc.devocao;
    const dd = cDev.def;
    aviso = `<p class="desc">${esc(dd.n)}: ${!temEsc ? 'precisa ser devoto de um deus (' + plural(dd.devoto, 'poder concedido', 'poderes concedidos') + ').' : op ? 'devoção escolhida: ' + esc(op) + '.' : 'escolha a devoção no painel da classe.'}${dd.deusesPermitidos ? ' Deuses permitidos: ' + esc(dd.deusesPermitidos.join(', ')) + '.' : ''}${dd.deusesProibidos ? ' Não pode ser devoto de ' + esc(dd.deusesProibidos.join(', ')) + '.' : ''}</p>`;
  }
  const semDevocao = DV.cls.find(c => c.def.naoDevoto);
  if (semDevocao) aviso += `<p class="desc">${esc(semDevocao.def.n)} não pode ter devoção a nenhum deus.</p>`;
  if (!d) return aviso + vazioPainel(DV.semDeus ? 'Sua devoção não envolve um deus específico.' : 'Ser devoto é opcional e dá um poder concedido (dois para clérigos, druidas, paladinos e frades).', 'Ver divindades', 'abrir-deus');
  let h = cabPainel(d.n, 'Energia ' + d.canal.toLowerCase() + ', arma preferida: ' + d.arma, 'Trocar', 'abrir-deus');
  h += aviso;
  h += `<p class="desc">${esc(d.areas)} Símbolo: ${esc(d.simb)}</p>`;
  const n = DV.concedidos.n;
  const sel = ch.poderes.filter(p => p.slot === 'concedido');
  const conc = concedidosDe(d).filter(p => fonteOk(p.f) || sel.some(s => s.n === p.n));
  h += bloco('Poderes concedidos', n ? opcoesLinhas(conc.map(p => [p.n, p.r + (p.f !== 'T20' ? ' (' + p.f + ')' : '')]), 'deus-pod', o => `data-n="${esc(o[0])}"`, o => sel.some(s => s.n === o[0]), () => sel.length >= n) : '<p class="desc">Nenhum poder concedido com a devoção atual.</p>', n ? `${sel.length} de ${n}` : '');
  h += bloco('Obrigações e restrições', `<p>${esc(d.obrig)}</p>`);
  h += `<div class="linha-acoes"><button class="btn btn-mini" data-act="deus-limpar">Deixar de ser devoto</button></div>`;
  return h;
}

function atrCaixa(k) {
  const b = DV.atBrk[k];
  const partes = [b.raca && 'raça ' + sinal(b.raca), b.origem && 'origem ' + sinal(b.origem), b.classe && 'classe ' + sinal(b.classe), b.poderes && 'poderes ' + sinal(b.poderes), b.tormenta && 'Tormenta ' + sinal(b.tormenta), b.ajuste && 'ajuste ' + sinal(b.ajuste)].filter(Boolean);
  const met = ch.atr.metodo;
  let ctrl = '';
  if (met === 'pontos') {
    const v = +ch.atr.base[k] || 0;
    ctrl = `<button class="btn btn-ico mini" data-act="atr-base" data-k="${k}" data-d="-1" aria-label="Diminuir ${ATRN[k]}"${v <= -1 ? ' disabled' : ''}>−</button><span class="base num">${sinalV(v)}</span><button class="btn btn-ico mini" data-act="atr-base" data-k="${k}" data-d="1" aria-label="Aumentar ${ATRN[k]}"${v >= 4 ? ' disabled' : ''}>+</button>`;
  } else if (met === 'rolagem') {
    const sel = ch.atr.rolAtr[k];
    const usados = Object.entries(ch.atr.rolAtr).filter(([kk]) => kk !== k).map(([, v]) => v);
    ctrl = `<select class="sel" data-act="atr-rol" data-k="${k}" aria-label="Rolagem para ${ATRN[k]}"><option value="">—</option>${ch.atr.rol.map((r, i) => `<option value="${i}"${sel === i ? ' selected' : ''}${usados.includes(i) ? ' disabled' : ''}>${r.t} (${sinalV(r.mod)})</option>`).join('')}</select>`;
  } else {
    ctrl = `<input type="number" min="-5" max="20" data-act="atr-manual" data-k="${k}" value="${+ch.atr.base[k] || 0}" aria-label="Base de ${ATRN[k]}">`;
  }
  return `<div class="atr"><span class="atr-rot">${ATRN[k]}</span><div class="atr-val">${sinalV(DV.at[k])}</div><div class="atr-brk">${partes.length ? 'base ' + sinalV(b.base) + ', ' + partes.join(', ') : '&nbsp;'}</div><div class="atr-ctrl nao-imprime">${ctrl}</div></div>`;
}
function secCarac() {

    ${vital('pm', 'Pontos de mana', DV.pmAtual, DV.pmMax, 'pm', ch.pm.temp, 'Limite por habilidade: ' + DV.limitePM)}
