const SLOT_NOME = s => s === 'origem' ? 'origem' : s === 'concedido' ? 'concedido' : s === 'livre' ? 'extra' : /^classe:/.test(s) ? 'poder de ' + ((CLASSE(s.slice(7)) || {}).n || 'classe').toLowerCase() : s;
function secHabilidades() {
  const grupos = [];
  if (DV.raca) grupos.push({ tit: DV.raca.n, itens: [...DV.raca.hab.map(h => ({ n: h[0], r: h[1] })), ...DV.racaOps.filter(o => o.op[1]).map(o => ({ n: o.op[0], r: o.op[1], nv: o.e.n }))] });
  if (DV.origem) {
    const it = [];
    if (DV.origem.regional) it.push({ n: 'Benefício regional', r: DV.origem.ben });
    else if (ch.origem.ben.length) it.push({ n: 'Perícias da origem', r: 'Treinado em ' + ch.origem.ben.join(' e ') + '.' });
    it.push({ n: 'Itens', r: DV.origem.itens });
    grupos.push({ tit: 'Origem: ' + DV.origem.n, itens: it });
  }
  DV.cls.forEach(c => {
    const it = c.def.hab.filter(h => h[1] <= c.niveis).map(h => ({ n: h[0], r: h[2], nv: ordinal(h[1]) }));
    (c.def.esc || []).forEach(e => { const op = e.op.find(o => o[0] === c.esc[e.id]); if (op && (e.nivel || 1) <= c.niveis) it.push({ n: e.n + ': ' + op[0], r: op[1] }); });
    grupos.push({ tit: c.def.n + ' ' + c.niveis, itens: it });
  });
  let h = `<div class="habs">`;
  h += grupos.map(g => `<div class="hab-grupo"><h3>${esc(g.tit)}</h3>${g.itens.map(i => `<div class="hab"><div class="hab-cab"><span class="hab-nome">${esc(i.n)}${i.nv ? `<span class="hab-nv">${esc(i.nv)}</span>` : ''}</span></div><div class="hab-txt">${esc(i.r)}</div></div>`).join('')}</div>`).join('');
  h += `<div class="hab-grupo"><h3>Poderes escolhidos</h3>${DV.pods.length ? DV.pods.map(poderHtml).join('') : '<p class="vazio-msg">Nenhum poder ainda.</p>'}</div>`;
  if (DV.deus && !DV.semDeus) h += `<div class="hab-grupo"><h3>Devoto de ${esc(DV.deus.n)}</h3><div class="hab"><div class="hab-txt">${esc(DV.deus.obrig)}</div></div></div>`;
  h += `</div>`;
  return `<section class="sec" id="sec-habilidades">${titSec('Habilidades e poderes', `<button class="btn btn-mini" data-act="abrir-poder" data-slot="livre">Adicionar poder</button>`)}${h}</section>`;
}
function poderHtml(x) {
  const { p, def } = x;
  const r = def ? def.r : '';
  let extra = '';
  if (p.n === 'Aumento de Atributo') {
    extra = `<label>Atributo <select class="sel" data-act="pod-op" data-uid="${p.uid}"><option value="">Escolher…</option>${ATR.map(k => `<option value="${k}"${p.op === k ? ' selected' : ''}>${ATRN[k]}</option>`).join('')}</select></label>`;
  } else if (def && def.op) {
    extra = `<label>Opção <select class="sel" data-act="pod-op" data-uid="${p.uid}"><option value="">Escolher…</option>${def.op.map(o => `<option value="${esc(o)}"${p.op === o ? ' selected' : ''}>${esc(PROF_NOME[o] || o)}</option>`).join('')}</select></label>`;
  }
  if (def && def.txt) {
    if (def.txt === 'Perícia') extra += `<label>${esc(def.txt)} <select class="sel" data-act="pod-txt" data-uid="${p.uid}">${opcoesPericia(null, p.txt || '')}</select></label>`;
    else extra += `<label>${esc(def.txt)} <input data-act="pod-txt" data-uid="${p.uid}" value="${esc(p.txt || '')}" placeholder="${def.txt === 'Arma' ? 'ex.: Espada longa' : ''}"></label>`;

  const pre = x.pre && x.pre.itens.length ? `<div class="pre">Pré-requisitos: ${x.pre.itens.map(i => `<span class="${i.ok === true ? 'ok' : i.ok === false ? 'no' : 'q'}">${esc(i.t)}</span>`).join(', ')}</div>` : '';
  return `<div class="hab"><div class="hab-cab"><span class="hab-nome">${esc(p.n)}<span class="hab-nv">${esc(SLOT_NOME(p.slot))}${p.tipo && !['Classe', 'Origem', 'Concedido'].includes(p.tipo) ? ', ' + esc(p.tipo.toLowerCase()) : ''}</span></span><button class="btn-remover nao-imprime" data-act="pod-remover" data-uid="${p.uid}" aria-label="Remover ${esc(p.n)}">remover</button></div>
    <div class="hab-txt">${esc(r || 'Descrição não disponível.')}</div>${pre}${extra ? `<div class="hab-extra nao-imprime">${extra}</div>` : ''}</div>`;

// ---- 045_retrato.js
// ===== Retrato do personagem =====
// A imagem é reduzida (lado maior com até 640 px) e guardada como JPEG dentro da ficha,
// para caber no armazenamento do navegador e ir junto no arquivo exportado.
const RETRATO_MAX = 640;
const retratoValido = r => !!(r && typeof r.src === 'string' && /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(r.src));
let retratoCache = { src: null, url: null };

function dataUrlParaBlob(du) {
  const i = du.indexOf(',');
  const mime = (du.slice(0, i).match(/^data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(du.slice(i + 1));
  const u8 = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
  return new Blob([u8], { type: mime });
}
// usa uma URL curta (blob:) no HTML em vez de repetir a imagem inteira a cada atualização da ficha
function urlRetrato() {
  const r = ch.retrato;
  if (!retratoValido(r)) return null;
  if (retratoCache.src !== r.src) {
    if (retratoCache.url) URL.revokeObjectURL(retratoCache.url);
    retratoCache = { src: r.src, url: URL.createObjectURL(dataUrlParaBlob(r.src)) };
  }
  return retratoCache.url;
}

function retratoHtml() {
  const url = urlRetrato();
  if (!url) {
    return `<div class="retrato-caixa">
      <button type="button" class="retrato vazio" data-act="retrato-escolher" title="Escolher a imagem do personagem">
        <span class="retrato-tit">Retrato</span><span class="retrato-dica">Clique ou arraste uma imagem</span>
      </button></div>`;
  }
  const r = ch.retrato;
  return `<div class="retrato-caixa">
    <div class="retrato" data-retrato tabindex="0" role="img" aria-label="Retrato de ${esc(ch.nome || 'personagem')}. Arraste a imagem ou use as setas para enquadrar." title="Arraste para enquadrar">
      <img src="${url}" alt="" draggable="false" style="object-position:${+r.x || 50}% ${r.y == null ? 30 : +r.y}%">
    </div>
    <div class="retrato-acoes nao-imprime"><button type="button" class="btn-remover" data-act="retrato-escolher">Trocar</button><button type="button" class="btn-remover" data-act="retrato-remover">Remover</button></div>
  </div>`;
}

function processarImagem(arquivo) {
  return new Promise((ok, falha) => {
    const ehImagem = arquivo && (/^image\//.test(arquivo.type) || /\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(arquivo.name || ''));
    if (!ehImagem) { falha(new Error('tipo')); return; }
    const url = URL.createObjectURL(arquivo);
    const img = new Image();
    img.onload = () => {
      const esc0 = Math.min(1, RETRATO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * esc0)), h = Math.max(1, Math.round(img.naturalHeight * esc0));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      cx.fillStyle = '#FBFAF7';            // fundo claro para imagens com transparência
      cx.fillRect(0, 0, w, h);
      cx.imageSmoothingEnabled = true;
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = 0.86, src = cv.toDataURL('image/jpeg', q);
      while (src.length > 300000 && q > 0.5) { q -= 0.08; src = cv.toDataURL('image/jpeg', q); }
      ok(src);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('leitura')); };
    img.src = url;
  });
}
function definirRetrato(arquivo) {
  processarImagem(arquivo).then(src => {
    ch.retrato = { src, x: 50, y: 30 };
    mudou();
    status('Retrato adicionado. Arraste a imagem para enquadrar.');
  }).catch(e => {
    status(e.message === 'tipo' ? 'Esse arquivo não é uma imagem.' : 'Não consegui abrir essa imagem. Tente um arquivo JPG, PNG ou WebP.', true);
  });
}
function posicaoRetrato(img) {
  img.style.objectPosition = ch.retrato.x + '% ' + ch.retrato.y + '%';
}

function iniciarRetrato() {
  $('#arquivo-img').addEventListener('change', ev => {
    const f = ev.target.files && ev.target.files[0];
    if (f) definirRetrato(f);
    ev.target.value = '';
  });

  // arrastar a imagem dentro da moldura para enquadrar
  let arrasto = null;
  document.addEventListener('pointerdown', ev => {
    const box = ev.target.closest('[data-retrato]');
    if (!box || !retratoValido(ch.retrato) || ev.button > 0) return;
    const img = box.querySelector('img');
    if (!img || !img.naturalWidth) return;
    ev.preventDefault();
    box.focus({ preventScroll: true });
    try { box.setPointerCapture(ev.pointerId); } catch (e) { /* ignora */ }
    const fw = img.clientWidth, fh = img.clientHeight;
    const s = Math.max(fw / img.naturalWidth, fh / img.naturalHeight);
    arrasto = { box, img, id: ev.pointerId, x0: ev.clientX, y0: ev.clientY, px: +ch.retrato.x || 50, py: ch.retrato.y == null ? 30 : +ch.retrato.y, ox: img.naturalWidth * s - fw, oy: img.naturalHeight * s - fh };
    box.classList.add('arrastando');
  });
  document.addEventListener('pointermove', ev => {
    const a = arrasto;
    if (!a || ev.pointerId !== a.id) return;
    if (a.ox > 1) ch.retrato.x = Math.round(limitar(a.px - (ev.clientX - a.x0) / a.ox * 100, 0, 100));
    if (a.oy > 1) ch.retrato.y = Math.round(limitar(a.py - (ev.clientY - a.y0) / a.oy * 100, 0, 100));
    posicaoRetrato(a.img);
  });
  const fimArrasto = ev => {
    if (!arrasto || ev.pointerId !== arrasto.id) return;
    arrasto.box.classList.remove('arrastando');
    arrasto = null;
    ch.atualizado = Date.now();
    salvar();
  };
  document.addEventListener('pointerup', fimArrasto);
  document.addEventListener('pointercancel', fimArrasto);

  // setas do teclado também enquadram
  document.addEventListener('keydown', ev => {
    const box = ev.target.closest && ev.target.closest('[data-retrato]');
    if (!box || !retratoValido(ch.retrato)) return;
    const passo = ev.shiftKey ? 10 : 4;
    const mov = { ArrowLeft: ['x', passo], ArrowRight: ['x', -passo], ArrowUp: ['y', passo], ArrowDown: ['y', -passo] }[ev.key];
    if (!mov) return;
    ev.preventDefault();
    const atual = mov[0] === 'x' ? (+ch.retrato.x || 50) : (ch.retrato.y == null ? 30 : +ch.retrato.y);
    ch.retrato[mov[0]] = limitar(atual + mov[1], 0, 100);
    posicaoRetrato(box.querySelector('img'));
    ch.atualizado = Date.now();
    salvar();
  });

  // soltar uma imagem na moldura; em qualquer outro ponto, evita que o navegador abra o arquivo e saia da ficha
  const temArquivo = ev => ev.dataTransfer && [...(ev.dataTransfer.types || [])].includes('Files');
  const marcarAlvo = el => $$('.retrato-caixa').forEach(x => x.classList.toggle('alvo', x === el));
  document.addEventListener('dragover', ev => {
    if (!temArquivo(ev)) return;
    ev.preventDefault();
    const alvo = ev.target.closest('.retrato-caixa');
    ev.dataTransfer.dropEffect = alvo ? 'copy' : 'none';
    marcarAlvo(alvo);
  });
  document.addEventListener('dragleave', ev => { if (!ev.relatedTarget) marcarAlvo(null); });
  document.addEventListener('drop', ev => {
    if (!temArquivo(ev)) return;
    ev.preventDefault();
    marcarAlvo(null);
    const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    if (ev.target.closest('.retrato-caixa')) definirRetrato(f);
    else if (/^image\//.test(f.type)) status('Solte a imagem no quadro do retrato, ao lado do nome.');
  });

  // colar uma imagem (Ctrl+V) com a moldura selecionada
  document.addEventListener('paste', ev => {
    const ativo = document.activeElement;
    if (!ativo || !ativo.closest || !ativo.closest('.retrato-caixa')) return;
    const item = [...((ev.clipboardData && ev.clipboardData.items) || [])].find(i => /^image\//.test(i.type));
    if (!item) return;
    ev.preventDefault();
    definirRetrato(item.getAsFile());
  });
}

// ---- 046_nuvem.js
// ===== Salvamento na conta (só na versão publicada no Claude) =====
// Cada pessoa tem uma área privada no banco da página: data/users/<id>/
//   meta            -> { v, atual, prefs, ordem, apagadas }
//   f-<id>          -> o personagem (sem a imagem do retrato)
//   r-<id>-<n>      -> pedaços da imagem do retrato (documentos têm limite de tamanho)
// O navegador guarda uma cópia só para abrir mais rápido; a conta é quem vale.
// Ao abrir, cada personagem fica com a versão mais recente (campo "atualizado").
const NUVEM = {
  ativa: MODO === 'claude',
  estado: MODO === 'claude' ? 'conectando' : 'desligada', // conectando | ok | local | desligada
  motivo: '',
  db: null, col: null,
  conhecido: new Map(),   // id do documento -> JSON que está na conta
  fila: new Map(),        // id do documento -> corpo a gravar (null = apagar)
  gravando: false,
  timer: null,
  erros: 0,
  demorou: false,
  provisorio: null        // ficha em branco criada enquanto a conta não respondia
};
const PEDACO_RETRATO = 180000; // caracteres por documento de retrato (o limite do documento é 256 KiB)
const espera = ms => new Promise(r => setTimeout(r, ms));

function nuvemLigada() { return NUVEM.ativa && NUVEM.estado === 'ok'; }

// estado mostrado no topo
function nuvemRotulo() {
  if (!NUVEM.ativa) return null;
  if (NUVEM.estado === 'conectando') return NUVEM.demorou
    ? { txt: 'Conta sem resposta', cls: 'local', tit: 'A conta ainda não respondeu. As mudanças ficam neste navegador e vão para a conta quando ela responder.' }
    : { txt: 'Abrindo sua conta…', cls: 'esperando', tit: 'Buscando as fichas salvas na sua conta Claude.' };
  if (NUVEM.estado === 'ok') return NUVEM.gravando || NUVEM.fila.size
    ? { txt: 'Salvando…', cls: 'esperando', tit: 'Enviando as mudanças para a sua conta Claude.' }
    : { txt: 'Salvo na conta', cls: 'ok', tit: 'As fichas ficam na sua conta Claude: abra este link em outro aparelho com a mesma conta.' };
  return { txt: 'Só neste navegador', cls: 'local', tit: NUVEM.motivo || 'O salvamento na conta não está disponível agora. Use Exportar para guardar uma cópia.' };
}
function atualizarRotuloNuvem() {
  const el = document.getElementById('nuvem-estado'); if (!el) return;
  const r = nuvemRotulo(); if (!r) return;
  el.textContent = r.txt; el.title = r.tit; el.className = 'nuvem-estado ' + r.cls;
}

// JSON com as chaves em ordem: compara o que está na conta com o que está aqui sem depender da ordem dos campos
function jsonCanonico(v) {
  if (Array.isArray(v)) return '[' + v.map(x => x === undefined ? 'null' : jsonCanonico(x)).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined && typeof v[k] !== 'function').map(k => JSON.stringify(k) + ':' + jsonCanonico(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
// documentos que representam o estado atual
const cacheRetrato = new Map(); // imagem -> pedaços
function partesRetrato(src) {
  if (!cacheRetrato.has(src)) {
    const partes = [];
    for (let i = 0; i < src.length; i += PEDACO_RETRATO) partes.push(src.slice(i, i + PEDACO_RETRATO));
    if (cacheRetrato.size > 40) cacheRetrato.clear();
    cacheRetrato.set(src, partes);
  }
  return cacheRetrato.get(src);
}
function documentosDesejados() {
  const docs = new Map();
  const apagadas = podarApagadas(store.apagadas || {});
  docs.set('meta', { v: 1, atual: store.atual, prefs: store.prefs, ordem: store.lista.map(p => p.id), apagadas });
  store.lista.forEach(p => {
    const corpo = Object.assign({}, p);
    if (p.retrato && p.retrato.src) {
      const partes = partesRetrato(p.retrato.src);
      corpo.retrato = { x: p.retrato.x, y: p.retrato.y, partes: partes.length };
      partes.forEach((s, k) => docs.set('r-' + p.id + '-' + k, { s }));
    }
    docs.set('f-' + p.id, corpo);
  });
  return docs;
}
function podarApagadas(ap) {
  const limite = Date.now() - 400 * 24 * 3600 * 1000;
  Object.keys(ap).forEach(id => { if (!(ap[id] > limite)) delete ap[id]; });
  return ap;
}

// grava o que mudou, um documento por vez
function agendarNuvem(agora) {
  if (!nuvemLigada()) return;
  clearTimeout(NUVEM.timer);
  NUVEM.timer = setTimeout(prepararEnvio, agora ? 0 : 1200);
}
function prepararEnvio() {
  if (!nuvemLigada()) return;
  const desejados = documentosDesejados();
  desejados.forEach((corpo, id) => {
    const json = id.startsWith('r-') ? corpo.s : jsonCanonico(corpo);
    if (NUVEM.conhecido.get(id) !== json) NUVEM.fila.set(id, { corpo: JSON.parse(JSON.stringify(corpo)), json });
    else NUVEM.fila.delete(id);
  });
  NUVEM.conhecido.forEach((_, id) => { if (!desejados.has(id)) NUVEM.fila.set(id, null); });
  atualizarRotuloNuvem();
  enviarFila();
}
async function enviarFila() {
  if (NUVEM.gravando || !nuvemLigada()) return;
  NUVEM.gravando = true;
  let gravouAlgo = false;
  try {
    while (NUVEM.fila.size && nuvemLigada()) {
      // apaga primeiro o que sobrou (libera espaço), depois grava personagens e por fim o índice
      const ids = [...NUVEM.fila.keys()].sort((a, b) => peso(a, NUVEM.fila.get(a)) - peso(b, NUVEM.fila.get(b)));
      const id = ids[0];
      const item = NUVEM.fila.get(id);
      NUVEM.fila.delete(id);
      try {
        await tentarDuasVezes(() => item ? NUVEM.col.doc(id).set(item.corpo) : NUVEM.col.doc(id).delete());
        if (item) NUVEM.conhecido.set(id, item.json); else NUVEM.conhecido.delete(id);
        gravouAlgo = true; NUVEM.erros = 0;
      } catch (e) {
        if (!NUVEM.fila.has(id)) NUVEM.fila.set(id, item);
        falhaGravacao(e);
        break;
      }
    }
  } finally {
    NUVEM.gravando = false;
    atualizarRotuloNuvem();
  }
  if (gravouAlgo && !NUVEM.fila.size && nuvemLigada()) status('Salvo na sua conta');
}
const peso = (id, item) => item === null ? 0 : id === 'meta' ? 3 : id.startsWith('r-') ? 1 : 2;
async function tentarDuasVezes(fn) {
  try { return await fn(); } catch (e) {
    if (!e || (e.code !== 'unavailable' && e.code !== 'resource_exhausted')) throw e;
    await espera(600 + Math.random() * 1200);
    return fn();
  }
}
function falhaGravacao(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') {
    status('O espaço da conta para esta página acabou. Remova retratos ou fichas antigas, ou exporte uma cópia.', true);
    return;
  }
  if (code === 'invalid_argument' || code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') {
    passarParaLocal('Esta conta não pode guardar fichas nesta página. Elas ficam neste navegador; use Exportar para guardar uma cópia.');
    return;
  }
  NUVEM.erros++;
  status('Não deu para salvar na conta agora; a ficha continua neste navegador e eu tento de novo na próxima mudança.', true);
}
function passarParaLocal(motivo) {
  NUVEM.estado = 'local'; NUVEM.motivo = motivo;
  NUVEM.fila.clear(); clearTimeout(NUVEM.timer);
  status(motivo, true);
  atualizarRotuloNuvem();
}

// junta o que está na conta com a cópia deste navegador
function mesclarNuvem(docs, haviaCopiaLocal) {
  const mapa = new Map();
  docs.forEach(d => {
    if (!d.exists) return;
    const corpo = d.data();
    mapa.set(d.id, corpo);
    NUVEM.conhecido.set(d.id, d.id.startsWith('r-') ? (corpo && corpo.s) : jsonCanonico(corpo));
  });
  const meta = mapa.get('meta') || null;
  const remotos = new Map();
  mapa.forEach((corpo, id) => {
    if (!id.startsWith('f-')) return;
    const p = clone(corpo);
    if (p.retrato && p.retrato.partes) {
      let src = '', ok = true;
      for (let k = 0; k < p.retrato.partes; k++) {
        const r = mapa.get('r-' + p.id + '-' + k);
        if (!r || typeof r.s !== 'string') { ok = false; break; }
        src += r.s;
      }
      p.retrato = ok ? { src, x: p.retrato.x, y: p.retrato.y } : null;
    }
    if (p.id) remotos.set(p.id, p);
  });
  const apagadas = Object.assign({}, (meta && meta.apagadas) || {});
  Object.entries(store.apagadas || {}).forEach(([id, t]) => { if (!(apagadas[id] >= t)) apagadas[id] = t; });
  const prov = NUVEM.provisorio;
  const locais = new Map(store.lista.filter(p => !(prov && p.id === prov.id && p.atualizado === prov.t)).map(p => [p.id, p]));
  const ordem = unico([...((meta && meta.ordem) || []), ...remotos.keys(), ...locais.keys()]);
  const lista = [];
  ordem.forEach(id => {
    const r = remotos.get(id), l = locais.get(id);
    const tr = r ? +r.atualizado || 0 : -1, tl = l ? +l.atualizado || 0 : -1;
    if (apagadas[id] && apagadas[id] >= Math.max(tr, tl)) return;
    const p = tl > tr ? l : r;
    if (p) lista.push(normalizarPersonagem(p));
  });
  store.apagadas = apagadas;
  if (meta && meta.prefs && !haviaCopiaLocal) store.prefs = Object.assign(store.prefs, meta.prefs);
  prefsFontes(store.prefs);
  const atualLocal = haviaCopiaLocal ? store.atual : null;
  store.lista = lista;
  store.atual = [atualLocal, meta && meta.atual].find(id => id && lista.some(p => p.id === id)) || (lista[0] && lista[0].id) || null;
}

// liga a nuvem: chamada no início, sem bloquear a primeira tela
async function iniciarNuvem(haviaCopiaLocal, aoCarregar) {
  if (!NUVEM.ativa) return;
  let terminou = false;
  const relogio = setTimeout(() => {
    if (terminou) return;
    NUVEM.demorou = true;
    status('A conta está demorando para responder. Você pode seguir editando; as mudanças ficam neste navegador até ela responder.', true);
    aoCarregar(false);
  }, 10000);
  const acabar = () => { terminou = true; clearTimeout(relogio); };
  try {
    const cl = window.claude;
    if (!cl || typeof cl.use !== 'function') throw { code: 'sem_runtime' };
    const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
    if (!db || !user) throw { code: 'sem_db' };
    if (user.can && user.can('data.write') === false) throw { code: 'sem_escrita' };
    const uid = await user.id();
    if (!uid) throw { code: 'sem_id' };
    const col = db.collection('data/users/' + uid);
    const snap = await tentarDuasVezes(() => col.get());
    acabar();
    NUVEM.db = db; NUVEM.col = col;
    mesclarNuvem(snap.docs, haviaCopiaLocal);
    NUVEM.estado = 'ok'; NUVEM.motivo = ''; NUVEM.demorou = false; NUVEM.provisorio = null;
    aoCarregar(true);
    agendarNuvem(true);
  } catch (e) {
    acabar();
    const code = e && e.code;
    const motivo = code === 'sem_db' || code === 'sem_id'
      ? 'Entre na sua conta Claude para guardar as fichas nela. Por enquanto elas ficam neste navegador.'
      : code === 'sem_escrita'
        ? 'Com o seu acesso a esta página não dá para guardar fichas na conta. Elas ficam neste navegador; use Exportar para guardar uma cópia.'
        : 'O salvamento na conta não respondeu. As fichas ficam neste navegador por enquanto; use Exportar para guardar uma cópia.';
    NUVEM.estado = 'local'; NUVEM.motivo = motivo;
    status(motivo, true);
    aoCarregar(false);
  }
}

// downloads (exportar e imprimir) na página publicada
async function salvarArquivo(nome, dados, rotulo) {
  if (MODO !== 'claude') { baixar(nome, dados); status(rotulo + ' pronto'); return; }
  let dl = null;
  try { dl = window.claude && await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (!dl) { status('Baixar arquivos não está disponível nesta visualização. Abra a página pelo link no navegador.', true); return; }
  try {
    await dl.save({ filename: nome, data: dados });
    status(rotulo + ' pronto');
  } catch (e) {
    const code = e && e.code;
    if (code === 'declined') status('Download cancelado.');
    else if (code === 'rate_limited') status('Já há um download esperando confirmação.', true);
    else status('Não foi possível baixar o arquivo aqui.', true);
  }
}

// versão da ficha para imprimir: um arquivo .html que abre a janela de impressão sozinho
function htmlImpressao() {

function abrirPersonagem(id) {

function irPara(sel) {
  const el = $(sel); if (!el) return;
  el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
function limparEscolhas(prefixo) {
  Object.keys(ch.escolhas).forEach(k => { if (k.startsWith(prefixo) || k.startsWith('b:' + prefixo)) delete ch.escolhas[k]; });
}
function removerClasseDados(id) {
  ch.poderes = ch.poderes.filter(p => p.slot !== 'classe:' + id && !(p.tipo === 'Classe' && p.classe === id && p.slot !== 'livre'));
  ch.magias = ch.magias.filter(m => m.classe !== id);
  delete ch.escolas[id];
  limparEscolhas('classe:' + id);
}
function toggleLista(lista, v, max) {
  const i = lista.indexOf(v);
  if (i >= 0) { lista.splice(i, 1); return true; }
  if (max != null && lista.length >= max) return false;
  lista.push(v); return true;
}
function parseCrit(c) {
  const m = String(c || 'x2').match(/^(\d+)?(?:\/)?(?:x(\d+))?$/);
  if (!m) return [20, 2];
  return [m[1] ? +m[1] : 20, m[2] ? +m[2] : 2];
}
function rolarDano(expr, mult) {
  const m = expr.match(/^(\d*)d(\d+)(.*)$/);
  if (!m) return rolarExpr(expr);
  const q = +(m[1] || 1) * (mult || 1), l = +m[2];
  const rs = Array.from({ length: q }, () => d(l));
  const resto = m[3] ? rolarExpr(m[3]) : { total: 0, det: '' };
  return { total: soma(rs) + resto.total, det: q + 'd' + l + ' [' + rs.join(', ') + ']' + (m[3] ? ' ' + m[3].replace('-', '−') : '') };
}
function mostrarRolagem(r) {
  const id = novoId();
  ui.rolagens.unshift(Object.assign({ id }, r));
  ui.rolagens = ui.rolagens.slice(0, 3);
  renderRolagens();
  setTimeout(() => { ui.rolagens = ui.rolagens.filter(x => x.id !== id); renderRolagens(); }, 9000);
}
function renderRolagens() {
  $('#rolagem').innerHTML = ui.rolagens.map(r => `<div class="r ${r.cls || ''}"><div class="r-tit"><span>${esc(r.tit)}</span><button data-act="rol-fechar" data-id="${r.id}" aria-label="Fechar">×</button></div>
    <div class="r-res num">${r.total}<small>${esc(r.det)}</small></div>${r.extra ? `<div class="peq">${r.extra}</div>` : ''}</div>`).join('');
}
function rolarPericia(n) {
  const p = DV.per[n]; if (!p) return;
  const r = d(20);
  mostrarRolagem({ tit: n + (p.usavel ? '' : ' (exige treino)'), total: r + p.tot, det: 'd20 ' + r + ' ' + sinal(p.tot), cls: r === 20 ? 'crit' : r === 1 ? 'falha' : '' });
}
function rolarAtaque(i) {
  const a = DV.ataques[i]; if (!a) return;
  const r = d(20);
  const [margem, mult] = parseCrit(a.crit);
  const ameaca = r >= margem;
  let extra = '';
  if (a.danoExpr) {
    const dn = rolarDano(a.danoExpr, ameaca ? mult : 1);
    extra = 'Dano <b>' + dn.total + '</b> <span class="mudo">' + esc(dn.det) + '</span>' + (ameaca ? '<br><b>Ameaça de crítico</b>: dados de dano ×' + mult + ' (confirme com o mestre)' : '');
  }
  mostrarRolagem({ tit: 'Ataque: ' + a.n, total: r + a.atk, det: 'd20 ' + r + ' ' + sinal(a.atk), cls: ameaca ? 'crit' : r === 1 ? 'falha' : '', extra });
}
function rolarAtributos() {
  let rol = Array.from({ length: 6 }, () => { const t = rolar4d6(); return { t, mod: modDeRolagem(t) }; });
  let guarda = 0;
  while (soma(rol.map(r => r.mod)) < 6 && guarda++ < 50) {
    const iMin = rol.reduce((m, r, i) => r.t < rol[m].t ? i : m, 0);
    const t = rolar4d6(); rol[iMin] = { t, mod: modDeRolagem(t) };
  }
  ch.atr.rol = rol; ch.atr.rolAtr = {};
}
function exportar() {
  const dados = { formato: 'ficha-t20', versao: 1, exportado: new Date().toISOString(), personagem: ch };
  salvarArquivo(nomeArquivo(ch.nome) + '.t20.json', JSON.stringify(dados, null, 2), 'Arquivo exportado');
}
function importarTexto(txt) {
  let dados;
  try { dados = JSON.parse(txt); } catch (e) { status('Esse arquivo não é um JSON válido.', true); return; }
  let lista = [];
  if (dados && dados.personagem) lista = [dados.personagem];
  else if (dados && Array.isArray(dados.lista)) lista = dados.lista;
  else if (Array.isArray(dados)) lista = dados;
  else if (dados && dados.atr && dados.classes) lista = [dados];
  lista = lista.filter(p => p && typeof p === 'object');
  if (!lista.length) { status('Nenhum personagem encontrado nesse arquivo.', true); return; }
  let primeiro = null;
  lista.forEach(p => {
    const n = normalizarPersonagem(p);
    if (store.lista.some(x => x.id === n.id)) n.id = novoId();
    store.lista.push(n);
    primeiro = primeiro || n;
  });
  abrirPersonagem(primeiro.id);
  status(plural(lista.length, 'personagem importado', 'personagens importados'));
}

    const i = ch.inv.find(x => x.uid === el.dataset.uid); if (!i) return;
    i.equip = el.checked;
    if (i.equip && (i.tipo === 'armadura' || i.tipo === 'escudo')) ch.inv.forEach(o => { if (o !== i && o.tipo === i.tipo) o.equip = false; });
    mudou();
  },
  'ajuste'(el) { ch.ajustes[el.dataset.k] = parseInt(el.value, 10) || 0; mudou({ gaveta: false }); },
  'ajuste-atr'(el) { ch.atr.ajuste[el.dataset.k] = parseInt(el.value, 10) || 0; mudou({ gaveta: false }); },
  'ajuste-per'(el) { const v = parseInt(el.value, 10) || 0; if (v) ch.ajustes.per[el.dataset.k] = v; else delete ch.ajustes.per[el.dataset.k]; mudou({ gaveta: false }); }
};

function definirCaminho(obj, caminho, valor) {
  const ps = caminho.split('.');
  let o = obj;
  for (let i = 0; i < ps.length - 1; i++) { o[ps[i]] = o[ps[i]] || {}; o = o[ps[i]]; }
  o[ps[ps.length - 1]] = valor;
}

function abrirAtual() {
  if (!store.lista.length) {
    const p = novoPersonagem(); store.lista.push(p);
    if (NUVEM.ativa && NUVEM.estado !== 'ok') NUVEM.provisorio = { id: p.id, t: p.atualizado };
  }
  ch = store.lista.find(p => p.id === store.atual) || store.lista[0];
  store.atual = ch.id;
}
function iniciar() {
  lerStore();
  aplicarTema();
  store.lista = store.lista.map(normalizarPersonagem);
  const haviaCopia = store.lista.length > 0;
  if (NUVEM.ativa && !haviaCopia) {
    // primeira visita neste navegador: espera a conta antes de criar uma ficha em branco
    $('#topo').innerHTML = `<span class="marca">Ficha T20</span><span class="topo-esp"></span><span class="nuvem-estado esperando" id="nuvem-estado">Abrindo sua conta…</span>`;
    $('#folha').innerHTML = `<div class="carregando" role="status">Abrindo as fichas salvas na sua conta…</div>`;
  } else {
    abrirAtual();
    renderTopo();
    renderFolha();
  }
  iniciarRetrato();
  if (NUVEM.ativa) iniciarNuvem(haviaCopia, ok => {
    abrirAtual();
    aplicarTema();
    renderTopo(); renderFolha();
    if (ui.gaveta) renderGaveta();
    if (ok) salvarLocal();
  });

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (ui.menu && !ev.target.closest('.menu-pop') && !(el && el.dataset.act === 'menu')) { ui.menu = false; renderTopo(); }
    if (!el) return;
    const tag = el.tagName;
    if ((tag === 'SELECT' || tag === 'INPUT') && el.type !== 'button') return;
    const fn = ACOES[el.dataset.act];
    if (fn) { ev.preventDefault(); fn(el, ev); }
  });
  document.addEventListener('change', ev => {
    const el = ev.target;
    if (el.dataset && el.dataset.act && MUDANCAS[el.dataset.act]) { MUDANCAS[el.dataset.act](el); return; }
    if (el.dataset && el.dataset.bindNum) {
      const v = parseFloat(String(el.value).replace(',', '.'));
      definirCaminho(ch, el.dataset.bindNum, isNaN(v) ? 0 : Math.max(0, v));
      mudou();
    }
    if (el.dataset && el.dataset.bind === 'nome') renderTopo();
  });
  document.addEventListener('input', ev => {
    const el = ev.target;
    if (el.id === 'gav-q' && ui.gaveta) { ui.gaveta.q = el.value; ui.gaveta.aberto = null; renderListaGaveta(); return; }
    if (el.dataset && el.dataset.bind) {
      definirCaminho(ch, el.dataset.bind, el.value);
      ch.atualizado = Date.now();
      salvar();
      if (el.dataset.bind === 'nome') document.title = (el.value ? el.value + ' · ' : '') + 'Ficha T20';
    }
  });
  document.addEventListener('submit', ev => {
    const f = ev.target;
    if (!f.dataset || !f.dataset.form) return;
    ev.preventDefault();
    const fd = new FormData(f);
    if (f.dataset.form === 'custom') {
      const tipo = fd.get('tipo');
      const base = { uid: novoId(), n: String(fd.get('n') || '').trim() || 'Item', tipo, qtd: Math.max(1, +fd.get('qtd') || 1), esp: Math.max(0, +fd.get('esp') || 0), preco: Math.max(0, +fd.get('preco') || 0), nota: String(fd.get('nota') || '').trim(), f: 'Mesa', equip: false };
      if (tipo === 'arma') Object.assign(base, { cat: fd.get('cat'), prop: fd.get('prop'), emp: '1', dano: String(fd.get('dano') || '1d6').trim(), crit: String(fd.get('crit') || 'x2').trim(), dt: '', alc: fd.get('prop') === 'cc' ? '—' : 'curto', hab: [] });
      if (tipo === 'armadura') Object.assign(base, { peso: fd.get('pesada') ? 'pesada' : 'leve', bonus: +fd.get('bonus') || 0, pen: Math.min(0, +fd.get('pen') || 0) });
      if (tipo === 'escudo') Object.assign(base, { bonus: +fd.get('bonus') || 0, pen: Math.min(0, +fd.get('pen') || 0) });
      if (tipo === 'item') base.cat = 'Item da mesa';
      ch.inv.push(base);
      fecharGaveta(); mudou(); status(base.n + ' adicionado');
    }
    if (f.dataset.form === 'inicial') {
      const add = it => { if (it) ch.inv.push(it); };
      ['Mochila', 'Saco de dormir'].forEach(n => { const d0 = T20.itens.find(i => i.n === n); if (d0) add(itemGeral(d0)); });
      ch.inv.push({ uid: novoId(), n: 'Traje de viajante', tipo: 'item', cat: 'Vestuário', esp: 0, preco: 0, f: 'T20', nota: 'Roupa comum; não conta no limite de itens vestidos.', qtd: 1, equip: true });
      const s = T20.armas.find(a => a.n === fd.get('simples')); if (s) { const it = itemArma(s); it.equip = true; add(it); }
      const m = T20.armas.find(a => a.n === fd.get('marcial')); if (m) { const it = itemArma(m); it.equip = !s; add(it); }
      const ar = T20.armaduras.find(a => a.n === fd.get('armadura')); if (ar) { const it = itemArmadura(ar); it.equip = true; add(it); }
      if (fd.get('escudo')) { const e = T20.escudos.find(a => a.n === 'Escudo leve'); if (e) { const it = itemEscudo(e); it.equip = true; add(it); } }
      ch.dinheiro = Math.max(0, +fd.get('dinheiro') || 0);
      fecharGaveta(); mudou(); status('Equipamento inicial adicionado');
    }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') {
      if (ui.gaveta) { fecharGaveta(); return; }
      if (ui.menu) { ui.menu = false; renderTopo(); }
    }
  });
  $('#arquivo').addEventListener('change', ev => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importarTexto(String(r.result));
    r.onerror = () => status('Não foi possível ler o arquivo.', true);
    r.readAsText(f);
    ev.target.value = '';
  });
  window.addEventListener('storage', ev => { if (ev.key === CHAVE && !NUVEM.ativa) status('A ficha foi alterada em outra aba; recarregue para ver.', true); });
}
iniciar();

})();
</script>
</body>
</html>
